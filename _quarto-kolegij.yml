# Profil „kolegij" — nastavno izdanje iz istih izvora.
# Pokreni: quarto render --profile kolegij   (izlaz: docs-kolegij/)
#
# Razlika prema knjizi:
#   1. kod je OTVOREN (code-fold: false) jer se na seminaru čita i pokreće
#   2. seminarski materijali i tjedni raspored su u glavnoj navigaciji
#
# Rješenja zadataka. Odluka D06, ratificirana na G-A2d, predviđa jedan kanonski
# zapis rješenja po zadatku u dva sloja: sažete provjere u samostalnom izdanju i
# zaštićene rubrike te napomene za nastavnika u ovom profilu, uz izuzeće iz
# javnih AI izvoza. Ugovor je ratificiran, ali NIJE proveden: u izvoru zasad ne
# postoji nijedan zapis rješenja ni jedan profilni pojas, pa ovaj profil trenutno
# ne otkriva nikakvo rješenje. Ne opisuj ga kao da otkriva. Zapise pišu poglavljni
# paketi po ugovoru iz P2-ASSESS, a putove sastavlja P5-ROUTES.
#
# Kad zapisi budu postojali, sadržaj namijenjen samo nastavi omata se u:
#   ::: {.content-visible when-profile="kolegij"}
#   Rješenje …
#   :::
# a sadržaj koji u nastavnom izdanju treba nestati u:
#   ::: {.content-hidden when-profile="kolegij"}

project:
  # Lokalni artefakt, gitignoriran. Render usput prekopira i docs/ i pdf/ u
  # docs-kolegij/ jer su to obične datoteke u projektu; to je bezopasno, ali
  # znači da se docs-kolegij/ briše, ne čisti.
  output-dir: docs-kolegij

book:
  title: "Osnove statistike za društvene znanosti — nastavno izdanje"

format:
  html:
    code-fold: false
    code-tools: true

execute:
  echo: true
