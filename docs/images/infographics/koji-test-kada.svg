<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Stablo odluke i oporavka</title>
  <desc id="desc">Šest odluka vodi od pitanja i ishoda preko ovisnosti do početnoga postupka ili izlaza iz knjige.</desc>
  <rect width="800" height="1120" fill="white"/>

  <text x="54" y="58" font-size="18" font-weight="700">OD PITANJA DO POSTUPKA</text>
  <line x1="54" y1="78" x2="746" y2="78" stroke="black" stroke-width="1"/>

  <text x="54" y="126" font-size="14" font-weight="700" font-family="monospace">01</text>
  <text x="104" y="126" font-size="22" font-weight="700">PITANJE</text>
  <text x="104" y="154" font-size="15">Opis · povezanost · razlika · predviđanje · učinak</text>
  <line x1="75" y1="170" x2="75" y2="210" stroke="black" stroke-width="1"/>

  <text x="54" y="242" font-size="14" font-weight="700" font-family="monospace">02</text>
  <text x="104" y="242" font-size="22" font-weight="700">ISHOD I JEDINICA</text>
  <text x="104" y="270" font-size="15">Što mjerimo · što predstavlja jedan redak</text>
  <line x1="75" y1="286" x2="75" y2="326" stroke="black" stroke-width="1"/>

  <text x="54" y="358" font-size="14" font-weight="700" font-family="monospace">03</text>
  <text x="104" y="358" font-size="22" font-weight="700">DIZAJN I OVISNOST</text>
  <text x="104" y="386" font-size="15">Jesu li redci doista neovisne jedinice</text>

  <line x1="75" y1="404" x2="75" y2="492" stroke="black" stroke-width="1"/>
  <text x="92" y="438" font-size="13" font-weight="700">NEOVISNI REDCI</text>

  <line x1="360" y1="404" x2="360" y2="472" stroke="black" stroke-width="1"/>
  <text x="382" y="424" font-size="13" font-weight="700">POVEZANI REDCI</text>
  <text x="382" y="450" font-size="14">Točno dva mjerenja u paru</text>
  <text x="716" y="478" text-anchor="end" font-size="14" font-weight="700" font-family="monospace">P14 · UPARENI POSTUPAK</text>
  <line x1="382" y1="490" x2="716" y2="490" stroke="black" stroke-width="1"/>
  <text x="382" y="514" font-size="14">Ponovljeno · grupirano · vremensko · mrežno</text>
  <text x="716" y="536" text-anchor="end" font-size="16" font-weight="700">STANI · IZVAN KNJIGE</text>
  <line x1="382" y1="548" x2="716" y2="548" stroke="black" stroke-width="5"/>

  <text x="54" y="574" font-size="14" font-weight="700" font-family="monospace">04</text>
  <text x="104" y="574" font-size="22" font-weight="700">PROCJENJIVANA VELIČINA</text>
  <text x="104" y="602" font-size="15">Što treba ostati isto od pitanja do izvještaja</text>

  <line x1="54" y1="634" x2="746" y2="634" stroke="black" stroke-width="1"/>
  <text x="54" y="660" font-size="14">Opis brojčanoga ishoda</text>
  <text x="746" y="660" text-anchor="end" font-size="14" font-weight="700">P4–5 · SAŽECI I GRAF</text>
  <line x1="54" y1="678" x2="746" y2="678" stroke="black" stroke-width="1"/>

  <text x="54" y="705" font-size="14">Dvije brojčane varijable</text>
  <text x="746" y="705" text-anchor="end" font-size="14" font-weight="700">P6 I P16 · KORELACIJA I REGRESIJA</text>
  <line x1="54" y1="723" x2="746" y2="723" stroke="black" stroke-width="1"/>

  <text x="54" y="750" font-size="14">Brojčani ishod · dvije neovisne skupine</text>
  <text x="746" y="750" text-anchor="end" font-size="14" font-weight="700">P14 · WELCH</text>
  <line x1="54" y1="768" x2="746" y2="768" stroke="black" stroke-width="1"/>

  <text x="54" y="795" font-size="14">Brojčani ishod · više neovisnih skupina</text>
  <text x="746" y="795" text-anchor="end" font-size="14" font-weight="700">P15 · ANOVA</text>
  <line x1="54" y1="813" x2="746" y2="813" stroke="black" stroke-width="1"/>

  <text x="54" y="840" font-size="14">Dvije kategoričke varijable</text>
  <text x="746" y="840" text-anchor="end" font-size="14" font-weight="700">P13 · HI-KVADRAT ILI FISHER</text>
  <line x1="54" y1="858" x2="746" y2="858" stroke="black" stroke-width="1"/>

  <text x="54" y="885" font-size="14">Sredina ili udio populacije iz uzorka</text>
  <text x="746" y="885" text-anchor="end" font-size="14" font-weight="700">P8–11 · PROCJENA I NESIGURNOST</text>
  <line x1="54" y1="903" x2="746" y2="903" stroke="black" stroke-width="1"/>

  <text x="54" y="930" font-size="14">Objavljeni binarni ishod</text>
  <text x="746" y="930" text-anchor="end" font-size="14" font-weight="700">P16 · ČITANJE OMJERA I INTERVALA</text>
  <line x1="54" y1="948" x2="746" y2="948" stroke="black" stroke-width="1"/>

  <text x="54" y="1002" font-size="14" font-weight="700" font-family="monospace">05</text>
  <text x="104" y="1002" font-size="20" font-weight="700">PRETPOSTAVKE</text>
  <text x="330" y="1002" font-size="15">Neovisnost · raspodjela · nacrt · nesigurnost</text>

  <text x="54" y="1058" font-size="14" font-weight="700" font-family="monospace">06</text>
  <text x="104" y="1058" font-size="20" font-weight="700">TVRDNJA</text>
  <text x="330" y="1058" font-size="15">Opisna · populacijska · prediktivna · uzročna</text>
  <line x1="54" y1="1086" x2="746" y2="1086" stroke="black" stroke-width="2"/>
</svg>
