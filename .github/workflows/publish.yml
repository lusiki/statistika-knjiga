name: Render and deploy Quarto book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup Quarto uses the GitHub API while resolving TinyTeX releases.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # rsvg links against the system librsvg2 on Linux; the CRAN binaries that
      # bundle it exist only for Windows/macOS. Without this the renv restore
      # dies with "error testing if 'rsvg' can be loaded".
      - name: Install system libraries required by pinned R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-dev

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup R from exact version pin
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Restore R packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Node from exact version pin
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Restore pinned browser package
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Install pinned Playwright Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Check canonical page, appendix, navigation, and solution routes
        run: python scripts/check-book-inventory.py

      - name: Prove book inventory drift fails closed
        run: python scripts/check-book-inventory-fixtures.py

      - name: Check generated solution route and pathway contracts
        run: |
          python scripts/build-solution-routes.py --check
          python scripts/check-assessment-architecture.py
          python scripts/check-pathways.py

      - name: Check design token sync (design-tokens.yml vs SCSS vs LaTeX)
        run: python bookwright_plugin/bookwright/scripts/run_rscript.py scripts/check-tokens.R

      - name: Check hard style and fixed manuscript structure
        run: python scripts/check-manuscript-integrity.py

      - name: Check figure introductions
        run: python scripts/check-figure-introductions.py

      - name: Check citation keys and required bibliography metadata
        run: python scripts/check-citations.py

      - name: Check definitions, concept ledger, glossary, and graph
        run: python scripts/check-concepts.py

      - name: Check current data integrity and fail-closed catalogue boundary
        run: python bookwright_plugin/bookwright/scripts/run_rscript.py scripts/check-data-integrity.R

      - name: Prove integrity checks fail closed
        run: python scripts/check-integrity-fixtures.py

      - name: Check widget source contracts
        run: python scripts/check-widgets.py .

      - name: Check all OJS and print-twin golden pairs
        run: python scripts/check-widget-parity.py .

      - name: Prove widget parity fails closed
        run: python scripts/check-widget-parity-fixtures.py

      - name: Check PDF wrapper failure paths
        run: pwsh -NoProfile -File scripts/check-pdf-release-path.ps1

      - name: Render fresh PDF through approved wrapper
        run: pwsh -NoProfile -File scripts/render-book-pdf.ps1 -RequireCleanCommit

      - name: Build and validate public AI exports in release mode
        run: python bookwright_plugin/bookwright/scripts/run_rscript.py R/build-ai-exports.R --release

      - name: Prove AI export release checks fail closed
        run: python scripts/check-ai-export-fixtures.py

      - name: Render HTML book
        run: quarto render

      - name: Validate final public AI export artifacts
        run: python bookwright_plugin/bookwright/scripts/run_rscript.py R/build-ai-exports.R --release --validate-only

      - name: Check rendered HTML freshness and completeness
        run: python scripts/check-rendered-html.py docs

      - name: Run pinned browser interaction smoke audit
        run: node scripts/audit-rendered-html.js --smoke --root docs

      - name: Prove browser smoke fails closed
        run: python scripts/check-browser-smoke-fixtures.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
