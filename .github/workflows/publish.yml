name: Render and deploy Quarto book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup Quarto uses the GitHub API while resolving TinyTeX releases.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup R from exact version pin
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Restore R packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Node from exact version pin
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Restore pinned browser package
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Check design token sync (design-tokens.yml vs SCSS vs LaTeX)
        run: python bookwright_plugin/bookwright/scripts/run_rscript.py scripts/check-tokens.R

      - name: Check hard style and fixed manuscript structure
        run: python scripts/check-manuscript-integrity.py

      - name: Check figure introductions
        run: python scripts/check-figure-introductions.py

      - name: Check citation keys and required bibliography metadata
        run: python scripts/check-citations.py

      - name: Check definitions, concept ledger, glossary, and graph
        run: python scripts/check-concepts.py

      - name: Check current data integrity and fail-closed catalogue boundary
        run: python bookwright_plugin/bookwright/scripts/run_rscript.py scripts/check-data-integrity.R

      - name: Prove integrity checks fail closed
        run: python scripts/check-integrity-fixtures.py

      - name: Check widget source contracts
        run: python scripts/check-widgets.py .

      - name: Check PDF wrapper failure paths
        run: pwsh -NoProfile -File scripts/check-pdf-release-path.ps1

      - name: Render fresh PDF through approved wrapper
        run: pwsh -NoProfile -File scripts/render-book-pdf.ps1 -RequireCleanCommit

      - name: Render HTML book
        run: quarto render

      - name: Check rendered HTML freshness and completeness
        run: python scripts/check-rendered-html.py docs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
