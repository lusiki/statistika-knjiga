name: Render and deploy Quarto book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Authenticate Quarto's GitHub API calls. `tinytex: true` below makes
      # Setup Quarto resolve the latest rstudio/tinytex-releases via
      # api.github.com; unauthenticated that is 60 req/hr/IP and intermittently
      # 403s on shared runners, hard-failing the step.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # renv is the target state, but the repo builds before `renv::init()` has
      # been run. Detect the lockfile and take the matching path.
      - name: Detect renv lockfile
        id: renv
        run: |
          if [ -f renv.lock ]; then echo "has=true" >> "$GITHUB_OUTPUT";
          else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Restore R packages from renv.lock
        if: steps.renv.outputs.has == 'true'
        uses: r-lib/actions/setup-renv@v2

      # showtext + sysfonts nose knjižna pisma u grafovima (Newsreader, Public
      # Sans, JetBrains Mono). Bez njih se sve i dalje renderira, ali figure
      # izgube tipografiju knjige — R/setup.R tada tiho gasi fig.showtext.
      #
      # NE STAVLJAJ KOMENTAR UNUTAR `packages: |`. To je YAML literal blok, pa
      # svaki redak ide pak-u kao ime paketa; redak koji počinje s `#` ruši
      # korak s "Cannot parse packages".
      - name: Install R packages (no lockfile yet)
        if: steps.renv.outputs.has != 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::yaml
            any::jsonlite
            any::stringr
            any::stringi
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::svglite
            any::showtext
            any::sysfonts

      - name: Check design token sync (design-tokens.yml vs SCSS vs LaTeX)
        # Non-blocking: a token drift should be visible in the log, but it must
        # not stop the site from deploying.
        continue-on-error: true
        run: Rscript scripts/check-tokens.R

      - name: Check widget source contracts
        run: python scripts/check-widgets.py .

      - name: Render HTML book
        run: quarto render

      - name: Check rendered HTML freshness and completeness
        run: python scripts/check-rendered-html.py docs

      - name: Render PDF (separate profile)
        id: pdf
        continue-on-error: true
        run: quarto render --profile pdf

      - name: Copy freshly-built PDF into docs for Pages download
        if: steps.pdf.outcome == 'success'
        run: |
          mkdir -p docs/pdf
          cp pdf/Statistika.pdf docs/pdf/Statistika.pdf

      - name: Warn if PDF render failed (deploying HTML only, old PDF stays)
        if: steps.pdf.outcome != 'success'
        run: |
          echo "::warning::PDF render failed — docs/pdf/Statistika.pdf will be the previously-committed version, not a fresh build. Check the 'Render PDF' step logs above."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
