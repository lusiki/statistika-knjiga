name: Render and deploy Quarto book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup Quarto uses the GitHub API while resolving TinyTeX releases.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup R from exact version pin
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Restore R packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Node from exact version pin
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Restore pinned browser package
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Check design token sync (design-tokens.yml vs SCSS vs LaTeX)
        # P1C-INTEGRITY owns the later fail-closed conversion of this check.
        continue-on-error: true
        run: Rscript scripts/check-tokens.R

      - name: Check widget source contracts
        run: python scripts/check-widgets.py .

      - name: Render HTML book
        run: quarto render

      - name: Check rendered HTML freshness and completeness
        run: python scripts/check-rendered-html.py docs

      - name: Render PDF (separate profile)
        # P1C-PDF owns the later wrapper-only blocking PDF repair.
        id: pdf
        continue-on-error: true
        run: quarto render --profile pdf

      - name: Copy freshly-built PDF into docs for Pages download
        if: steps.pdf.outcome == 'success'
        run: |
          mkdir -p docs/pdf
          cp pdf/Statistika.pdf docs/pdf/Statistika.pdf

      - name: Warn if PDF render failed (deploying HTML only, old PDF stays)
        if: steps.pdf.outcome != 'success'
        run: |
          echo "::warning::PDF render failed -- docs/pdf/Statistika.pdf will be the previously-committed version, not a fresh build. Check the 'Render PDF' step logs above."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
