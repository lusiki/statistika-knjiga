schema_version: 1
programme: comprehensive-review-first-edition

control:
  requirements_source: notes/reports/comprehensive-book-review-2026-07-31.md
  ratified_plan: notes/reports/comprehensive-review-implementation-plan-2026-08-03.md
  branch: revision/comprehensive-review
  baseline_commit: c163bda524b7081ec6a41d5ab75370f1700b1748
  ratified_at: "2026-08-03"
  last_updated: "2026-08-03"
  write_wip_limit: 1

execution:
  active_write_packet: null
  last_completed_packet: P0-CONTROL
  next_permitted_packet: P0-REGISTER

authority:
  bounded_verified_local_commits: true
  push: false
  merge: false
  tag: false
  archive: false
  deploy: false
  note: >-
    Gate A0 authorises scoped local packet commits only. Every external or
    public action requires a later explicit author decision.

decisions:
  G-A0:
    status: accepted
    accepted_at: "2026-08-03"
    evidence: 'Author: "I approve everything."'
    accepted_defaults:
      - D01
      - D02
      - D03
      - D04
      - D05
      - D06
      - D07
      - D08
      - D09
      - D10
      - D11
      - D12
      - D13
      - D14
      - D15
      - D16
    accepted_operations:
      O01:
        decision: Checkpoint the three approved planning documents.
        status: completed
        evidence: c163bda524b7081ec6a41d5ab75370f1700b1748
      O02:
        decision: Work on the dedicated revision branch.
        status: completed
        evidence: revision/comprehensive-review
      O03:
        decision: Permit bounded verified local packet commits.
        status: accepted
        exclusions: [push, merge, tag, archive, deploy]
    note: >-
      A0 does not silently approve later G-A1 through G-A6 evidence packets or
      specialist sign-offs. Those gates remain in sequence.

atomic_inventory:
  status: incomplete
  completion_packet: P0-REGISTER
  source_scope: Complete review, especially sections 4-14 and 16
  total_actionable_findings: null
  mapped_children: 0
  unmapped_actionable_findings: null
  zero_unmapped_required: true
  rule: >-
    P0-REGISTER cannot close until every actionable finding has a stable child
    item or an approved reason why it is not independently actionable.

packets:
  G-A0:
    sequence: 1
    kind: decision_gate
    status: accepted
    requires: []
    outputs:
      - Ratified D01-D16
      - Ratified O01-O03
    completion_evidence:
      - author approval on 2026-08-03
  P0-BASE:
    sequence: 2
    kind: shared_subsystem
    status: accepted
    requires: [G-A0]
    outputs:
      - Intentional planning checkpoint
      - Dedicated revision branch
      - Baseline state recorded in plan section 3
    completion_evidence:
      - c163bda524b7081ec6a41d5ab75370f1700b1748
      - notes/reports/comprehensive-review-implementation-plan-2026-08-03.md#3-current-baseline-and-control-plane
  P0-CONTROL:
    sequence: 3
    kind: shared_subsystem
    status: accepted
    requires: [G-A0, P0-BASE]
    outputs:
      - Seed implementation register
      - Forward-handoff ledger and protocol
      - Current-state dashboard and exact continuation prompt
      - Deterministic workflow validator
    exit_tests:
      - Workflow validator passes
      - Register, handoffs, and dashboard agree
      - Next permitted packet is explicit
    completion_evidence:
      - commit:b3463c7b6f7dc7e03a76f74f3a297e2e158e4c6e
      - check:scripts/check-review-workflow.R
      - result:workflow-validator-passed
  P0-REGISTER:
    sequence: 4
    kind: shared_subsystem
    status: ratified
    requires: [G-A0, P0-BASE, P0-CONTROL]
    outputs:
      - Complete atomic child inventory for R01-R36
      - Exact stable source anchors and fingerprints
      - Full packet catalogue and dependencies
      - Zero-unmapped proof
    exit_tests:
      - Every actionable finding is mapped or has an approved non-actionable reason
      - Every required child has owner, scope, prerequisites, and acceptance tests
      - Atomic inventory reports zero unmapped findings
    completion_evidence: []
  P0-STATE:
    sequence: 5
    kind: shared_subsystem
    status: ratified
    requires: [P0-REGISTER]
    outputs:
      - Valid Bookwright ledger enums and schemas
      - H10-aligned checkout-local skills and checks
      - Correct plugin cache path and fresh-thread verification
    completion_evidence: []
  P0-OUTSIDE:
    sequence: 6
    kind: outside_ask_setup
    status: ratified
    requires: [P0-REGISTER]
    outputs:
      - One bounded ask per external decision or recruitment need
      - Owners, resume conditions, and blocking dependencies
    completion_evidence: []

