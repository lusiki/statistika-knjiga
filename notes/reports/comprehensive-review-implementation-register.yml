  G-A1a:
    status: "accepted"
    accepted_at: "2026-08-03"
    author_disposition: "accepted_as_recommended"
    statistical_reviewer: "Luka Sikic"
    reviewer_date: "2026-08-03"
    evidence: "conversation:joint-G-A1a-approval-2026-08-03-Luka-Sikic"
    accepted_specification:
      "null": >-
        Raw-label permutation tests the full-distribution/no-association null
        under exchangeability; it is not an assumption-free test of equality
        of means.
      statistic: >-
        Retain the two-sided unstudentized difference in means and compare
        absolute permuted statistics with the absolute observed statistic.
      assumptions_and_scope: >-
        Name independent observational units and exchangeability or identical
        conditional outcome distributions under the null. Equal means alone
        are insufficient, observational labels were not randomized, and the
        procedure supports no causal claim.
      monte_carlo_rule: >-
        For B randomly generated permutations and b statistics at least as
        extreme as observed, use (b + 1) / (B + 1), including ties. Exact
        enumeration instead uses the exact proportion including the observed
        arrangement.
      known_null_demonstration: >-
        A claimed type-I-error rate must use a data-generating condition that
        satisfies the full-distribution null; nearly equal means are not
        sufficient evidence of that null.
      widget_and_print_twin: >-
        Revalidate the analytic normal-p-value widget and print twin for claim
        parity, but do not apply the Monte Carlo permutation correction to
        their analytic p-values unless they are deliberately converted to
        permutation algorithms.
      bayesian_balance: >-
        Retain the bounded outlook while acknowledging legitimate long-run
        frequentist error-control questions and Bayesian dependence on both
        priors and likelihood or model assumptions. Keep the book
        estimation-first and do not expand into full Bayesian instruction.
    rejected_alternatives:
      - "Target mean equality with a studentized permutation statistic."
      - "Replace the permutation inference with Welch inference."
      - "Replace the observational example with a randomized-design sharp-null example."
    authority_boundary: >-
      This decision authorises P1A-C10 only. It does not accept the future
      chapter edit, waive clean-session reproduction or independent methods
      evidence, or authorise P1A-C11 or any later packet.
  G-A1b:
    status: "accepted"
    accepted_at: "2026-08-03"
    author_disposition: "accepted_as_recommended"
    statistical_reviewer: "Luka Sikic"
    reviewer_date: "2026-08-03"
    evidence: "conversation:joint-G-A1b-approval-2026-08-03-Luka-Sikic"
    accepted_specification:
      target_and_null: >-
        Let Delta be the population mean for the TV group minus the population
        mean for the social-media group. Use the two-sided null Delta = 0
        against Delta != 0; this is a mean-difference claim, not a causal
        effect or a full-distribution equality claim.
      point_estimate: >-
        Retain the raw difference in sample means, TV minus social media. With
        social media as the reference category, the binary-predictor OLS
        coefficient equals that raw difference exactly; this identity concerns
        the point estimate and does not by itself identify the uncertainty
        procedure.
      welch_uncertainty: >-
        Keep Welch inference as the Chapter 14 default. Its standard error is
        sqrt(s_TV^2/n_TV + s_social^2/n_social), and its reference t
        distribution uses Welch-Satterthwaite degrees of freedom, which are
        generally non-integer. Equal group variances are not required.
      ordinary_ols_uncertainty: >-
        Ordinary lm uses a pooled homoskedastic residual variance and
        n_TV + n_social - 2 residual degrees of freedom. It is inferentially
        identical to the pooled two-sample Student test with var.equal = TRUE,
        not generally to default Welch inference. Numerical proximity or equal
        rounded intervals is not procedural identity.
      assumptions_and_scope: >-
        Name independent observational units, independent groups, a correctly
        coded quantitative outcome and reference group, and a sampling design
        that supports the stated target population. Exact small-sample t
        inference additionally relies on normal within-group outcomes or
        errors; large-sample use requires finite variances and no dominating
        observations. Ordinary homoskedastic OLS uncertainty also requires a
        common conditional residual variance. The observational group labels
        were not randomized and support no causal claim.
      numerical_reproduction: >-
        On the seeded Chapter 14 sample, n_social = 70, n_TV = 50, the group
        variances are 3.818634 and 4.214286, and both procedures estimate
        TV minus social media as 1.185714. Welch gives SE 0.372609, df 102.471,
        t 3.182193, p 0.001935, and a 95 percent interval from 0.446686 to
        1.924742. Pooled Student and ordinary OLS give SE 0.369537, df 118,
        t 3.208648, p 0.001717, and an interval from 0.453930 to 1.917498.
        Both intervals round to 0.45 to 1.92 at two decimals, so the correction
        must expose the standard-error and degrees-of-freedom distinction.
      implementation_surface: >-
        Source the chapter's default interval from Welch, retain ordinary OLS
        values only as an explicitly labelled contrast, use lm to demonstrate
        the coefficient/mean-difference identity, and remove the claim that lm
        and default t.test carry the same interval and are one inferential
        calculation. Leave the widget, print twin, paired comparison,
        Wilcoxon discussion, standardized effect, and confounding example
        outside this surgical correction.
      downstream_revalidation: >-
        Chapter 15 must keep common mean-model structure distinct from pooled
        versus Welch uncertainty. Chapter 16 may retain its exact equality
        demonstration only by naming its current var.equal = TRUE test as the
        pooled Student or ordinary homoskedastic special case; it must not
        generalize that identity to Chapter 14's Welch default. Separate
        Chapter 15 variance-ratio and Chapter 16 estimand, uncertainty, and
        leakage repairs remain governed by their registered items.
    rejected_alternatives:
      - "Make pooled Student or ordinary homoskedastic OLS the Chapter 14 default."
      - "Preserve the equivalence claim because the two-decimal intervals happen to match."
      - "Remove the binary-predictor bridge to the unified linear-model sequence."
      - "Replace Welch with generic robust OLS without naming its covariance estimator and degrees-of-freedom convention."
    authority_boundary: >-
      This decision authorises P1A-C14 only. It does not accept the future
      chapter edit, waive clean-session reproduction, independent methods
      evidence, targeted render, or scoped source-diff checks, settle the
      separate Chapter 15 or 16 repairs, or authorise P1A-C15 or any later
      packet.
  G-A1c:
    status: "accepted"
    accepted_at: "2026-08-03"
    amended_at: "2026-08-03"
    author_disposition: "accepted_as_recommended"
    author: "Luka Sikic"
    licence_and_data_lane_owner: "Luka Sikic"
    evidence: "conversation:G-A1c-owner-dispositions-zero-Navarro-use-2026-08-03-Luka-Sikic"
    original_evidence: "conversation:G-A1c-three-owner-dispositions-2026-08-03-Luka-Sikic"
    amendment_evidence: "conversation:G-A1c-zero-Navarro-use-2026-08-03-Luka-Sikic"
    accepted_dispositions:
      navarro_and_book_licence: >-
        Do not use Navarro as a source, drafting model, or reader-facing
        reference in the public book. Audit the current candidates, then remove
        every Navarro citation, name, analogy, example, distinctive
        argumentative sequence, and materially derived expression through
        omission or genuinely independent rewriting supported by primary or
        otherwise independently verified sources where evidence is needed.
        The internal provenance record remains and must prove that dependency
        was removed rather than concealed. P1B-NAVARRO cannot close while any
        material dependency survives.
      generated_teaching_data: >-
        Licence every generated teaching dataset under CC BY 4.0, subject to
        reconciliation with the final book licence.
      data_access_and_redistribution_lanes: >-
        Bundle only licence-cleared files, use portal mediation wherever
        redistribution authority is uncertain, keep restricted sources
        external, and provide a licence-cleared bundled file or aggregate
        alternative for every required student pathway. No package-specific
        exception is approved.
    rejected_alternatives:
      - "Retain materially derived Navarro prose without the required attribution or compatible ShareAlike terms."
      - "Keep avoidable Navarro-specific framing merely because it is already cited."
      - "Remove attribution while retaining materially derived expression or structure."
      - "Use Navarro as an unacknowledged drafting resource while deleting reader-facing references."
      - "Leave generated teaching data unlicensed or describe their licence as not applicable."
      - "Treat technical access as redistribution authority or bundle an uncleared package."
    authority_boundary: >-
      This decision authorises P1B-NAVARRO and P1B-DATA-LIC to audit and
      implement the accepted policy in sequence. It does not establish that
      any Navarro obligation has or has not survived, grant third-party
      redistribution permission, authorise ESS or any other package-specific
      bundling, accept either future evidence packet, or authorise push, merge,
      tag, archive, or deployment. Any contrary audit evidence must stop the
      affected packet; residual Navarro-dependent content must be removed or
      omitted rather than used without attribution.
  G-A1d:
    status: "accepted"
    accepted_at: "2026-08-03"
    author_disposition: "accepted_as_recommended"
    author: "Luka Sikic"
    release_owner: "Luka Sikic"
    archive_owner: "Luka Sikic"
    errata_owner: "Luka Sikic"
    evidence: "conversation:G-A1d-four-owner-dispositions-2026-08-03-Luka-Sikic"
    accepted_dispositions:
      edition_and_governance_mechanism: >-
        Create the edition/version, Croatian changelog, citation, provenance,
        archive-plan, term-freeze, and errata mechanisms locally in Phase 1.
        Keep Osnove statistike za društvene znanosti as the working release
        title under D14 unless the author changes it before citation metadata
        is frozen. Defer every immutable or public release action to its exact
        later A6 gate.
      archive_ownership: >-
        Luka Sikic, author, accepts responsibility for the eventual archival
        deposit and persistent identifier. The deposit remains prohibited
        until G-A6-ARCHIVE supplies immediate exact authority.
      errata_ownership: >-
        Luka Sikic, author, accepts continuing responsibility for the eventual
        public errata route and dated status log. Public activation remains
        prohibited until G-A6-DEPLOY supplies immediate exact authority.
      release_ownership: >-
        Luka Sikic, author, accepts release-gate coordination and exact
        source-state control, including the rule that authority is never
        inferred across push, merge, tag, archive, deployment, or publication.
    rejected_alternatives:
      - "Approve the governance mechanism only after one or more exact edition, version, changelog, citation, provenance, or ownership amendments."
      - "Change the working title now rather than retain D14 until citation metadata freeze."
      - "Defer the governance-mechanism decision and keep P1B-GOV blocked."
      - "Assign a separate archive specialist instead of the named release owner."
      - "Assign a separate continuing editorial errata owner instead of the named release owner."
      - "Separate release coordination from archive and errata responsibility among multiple owners."
      - "Defer any owner appointment and keep the corresponding release gates blocked."
    blocked_dependencies:
      immediate_next_packet:
        - "P1B-GOV"
      governed_items:
        - "R06-GOV-contract"
        - "R06-RELEASE-changelog"
        - "R06-RELEASE-citation"
        - "R06-RELEASE-tag"
        - "R06-RELEASE-archive"
        - "R06-RELEASE-term-freeze"
        - "R06-RELEASE-errata"
      later_gates_still_mandatory:
        - "G-A5c"
        - "G-A5d"
        - "G-A6"
        - "G-A6-ARCHIVE"
        - "G-A6-DEPLOY"
    authority_boundary: >-
      This decision authorises only P1B-GOV to implement and demonstrate the
      approved pre-release governance mechanisms locally. It does not freeze
      final title, authorship, version, date, citation, or release artifacts;
      accept P1B-GOV or any later packet; or authorise any push, merge, tag,
      archival deposit, deployment, publication, or other external action.
      Every such action retains its exact later gate and requires immediate
      source-state-specific authority.
