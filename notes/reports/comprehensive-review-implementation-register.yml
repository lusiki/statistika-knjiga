invalidations: []
packet_contracts:
  decision_gate:
    required_evidence:
      - "dated decision record"
      - "named decision owner"
      - "recommended default and alternatives"
      - "blocked dependency list"
    required_exit_tests:
      - "The named decision owner has explicitly accepted one disposition."
      - "Alternatives, authority boundary, and blocked dependencies are recorded."
    minimum_outputs: 2
  external_action_gate:
    required_evidence:
      - "immediate author authorisation"
      - "exact external target"
      - "accepted source commit or tag"
    required_exit_tests:
      - "The author explicitly authorises this exact external action immediately before execution."
      - "The target and immutable source state are exact and no broader authority is inferred."
    minimum_outputs: 2
  shared_subsystem:
    required_evidence:
      - "scoped implementation diff"
      - "deterministic subsystem check"
      - "handoff closeout record"
    required_exit_tests:
      - "The subsystem's declared state and deterministic validator agree."
      - "No chapter prose or unrelated subsystem is changed."
    minimum_outputs: 2
  outside_ask_setup:
    required_evidence:
      - "one ask per external owner or decision"
      - "blocked item links"
      - "resume condition per ask"
    required_exit_tests:
      - "Every genuine external dependency has one independently closable ask."
      - "No omnibus request or inferred permission remains."
    minimum_outputs: 2
  chapter_correction:
    required_evidence:
      - "approved correction specification where required"
      - "clean-session numerical reproduction"
      - "independent methods reading"
    required_exit_tests:
      - "The false or overbroad claim is removed from the chapter and all dependent results reproduce."
      - "Independent methods evidence is tied to the corrected source state."
    minimum_outputs: 2
  review_gate:
    required_evidence:
      - "gate-specific verification matrix"
      - "source commit or state hash"
      - "resolved blocker list"
    required_exit_tests:
      - "Every named prerequisite has its required evidence and no blocker is hidden by aggregation."
      - "The gate report is tied to one declared source state."
    minimum_outputs: 2
  evidence_licence:
    required_evidence:
      - "source and licence record"
      - "owner disposition"
      - "affected-file reconciliation"
    required_exit_tests:
      - "Rights, attribution, and redistribution are verified rather than inferred from access."
      - "Every affected source or package has one explicit lawful lane."
    minimum_outputs: 2
  evidence_metadata:
    required_evidence:
      - "citation usage report"
      - "authoritative metadata verification"
      - "claim-source fit record"
    required_exit_tests:
      - "Every citation resolves and metadata are verified from authoritative sources."
      - "No blanket inclusion, invented key, DOI, locator, or finding remains."
    minimum_outputs: 2
  documentation:
    required_evidence:
      - "source-state comparison"
      - "public metadata diff"
    required_exit_tests:
      - "Public documentation agrees with the live repository and governing contracts."
      - "No obsolete project-status or pathway promise remains."
    minimum_outputs: 2
  release_governance:
    required_evidence:
      - "approved governance schema"
      - "named owners"
      - "pre-release mechanism demonstration"
    required_exit_tests:
      - "Version, citation, changelog, archive, term-freeze, errata, and provenance mechanisms are defined."
      - "No push, tag, archive, or deployment occurs under the governance setup packet."
    minimum_outputs: 2
  release_engineering:
    required_evidence:
      - "locked clean-environment run"
      - "positive test"
      - "deliberate failing fixture"
    required_exit_tests:
      - "The declared production failure is blocking and fails closed."
      - "The command runs from committed dependencies without hidden local state."
    minimum_outputs: 2
  shared_architecture:
    required_evidence:
      - "ratified architecture decision"
      - "registry or contract diff"
      - "cross-book placement matrix"
    required_exit_tests:
      - "The architecture has explicit plant/develop/harvest roles and exclusions."
      - "No chapter prose is edited before the governing system is ratified."
    minimum_outputs: 2
  shared_registry:
    required_evidence:
      - "author-ratified registry diff"
      - "schema validation"
      - "consumer reconciliation"
    required_exit_tests:
      - "Every scoped registry entry is ratified, schema-valid, and linked to its consumers."
      - "Registry work does not silently edit chapter prose or advance chapter stage."
    minimum_outputs: 2
  governing_documents:
    required_evidence:
      - "approved contract changes"
      - "cross-document consistency diff"
      - "deterministic policy check"
    required_exit_tests:
      - "Blueprint, style, design, conventions, and registries state one consistent contract."
      - "No rejected scope branch or stale rule remains active."
    minimum_outputs: 2
  data_governance:
    required_evidence:
      - "catalogue schema"
      - "negative validation fixtures"
      - "candidate-promotion demonstration"
    required_exit_tests:
      - "Catalogue, passports, validation, refresh, and promotion fail closed."
      - "Rendering performs no network refresh and no competing metadata source exists."
    minimum_outputs: 2
  data_package:
    required_evidence:
      - "verified source version and licence"
      - "codebook and passport"
      - "checksum and source reconciliation"
      - "route-specific expected values"
    required_exit_tests:
      - "The package passes unit, schema, key, missing-code, checksum, and source reconciliation checks."
      - "Every promised R, no-code, print, or portal lane is lawful and testable."
    minimum_outputs: 2
  evidence_package:
    required_evidence:
      - "verified primary artifact"
      - "claim-source matrix"
      - "reproducible derived values"
    required_exit_tests:
      - "Every empirical quantity and representation reconciles to the verified artifact."
      - "The package supports the intended claim and explicitly records unavailable claims."
    minimum_outputs: 2
  reader_evidence:
    required_evidence:
      - "dated protocol and source state"
      - "deidentified session records"
      - "repeated/blocking finding memo"
    required_exit_tests:
      - "Reader evidence is tied to the tested source version and separates preference from repeated or blocking friction."
      - "Every repeated or blocking finding has a bounded disposition."
    minimum_outputs: 2
  chapter_or_part_packet:
    required_evidence:
      - "approved scope or spine"
      - "verified source/data and numerical results"
      - "targeted multi-format renders"
      - "fresh six-critic or part-continuity evidence"
    required_exit_tests:
      - "The complete vertical slice satisfies prose, data, evidence, figure, AI, assessment, print, and transition obligations."
      - "All fatal and major findings are resolved or explicitly author-disposed for the reviewed source state."
    minimum_outputs: 2
  chapter_acceptance_gate:
    required_evidence:
      - "six independent critic reports"
      - "synthesised revision disposition"
      - "author acceptance"
      - "chapter-ledger evidence tied to source state"
    required_exit_tests:
      - "All six critic perspectives address the final material chapter state."
      - "The author has accepted the synthesised disposition and no fatal or major finding is unresolved."
    minimum_outputs: 2
  assessment_unit:
    required_evidence:
      - "canonical answer records"
      - "independent numerical checks"
      - "profile visibility and export test"
    required_exit_tests:
      - "Every applicable task has its required key, check, rubric, or model-answer component."
      - "Protected instructor content is absent from public routes and exports."
    minimum_outputs: 2
  appendix:
    required_evidence:
      - "appendix-specific route artifact"
      - "clean pathway test"
      - "cross-reference and print proof"
    required_exit_tests:
      - "The appendix fulfils its exact public promise from canonical files and values."
      - "Its HTML, print, and supported pathway behavior is verified."
    minimum_outputs: 2
  pathway_verification:
    required_evidence:
      - "route coverage matrix"
      - "clean-install or print test"
      - "public-promise reconciliation"
    required_exit_tests:
      - "Every advertised pathway is complete, versioned where needed, and uses canonical data and expected values."
      - "Any undelivered promise is explicitly narrowed before publication."
    minimum_outputs: 2
  whole_book_review:
    required_evidence:
      - "whole-book source-anchor matrix"
      - "post-change reviewer evidence"
      - "resolved finding log"
    required_exit_tests:
      - "The review covers the final material state across all affected units."
      - "Fatal and major findings are resolved before downstream release proof."
    minimum_outputs: 2
  release_candidate:
    required_evidence:
      - "frozen source commit"
      - "declared lockfiles and data hashes"
      - "clean-worktree provenance"
    required_exit_tests:
      - "The release candidate is one immutable source state with declared dependencies and data."
      - "No warm cache, _freeze content, or untracked dependency is required."
    minimum_outputs: 2
  release_proof:
    required_evidence:
      - "format-specific proof report"
      - "source commit and artifact hash"
      - "negative or regression check"
    required_exit_tests:
      - "The format-specific proof covers every risk named in the packet scope."
      - "Evidence and artifact hashes are tied to the same release-candidate source state."
    minimum_outputs: 2
  release_metadata:
    required_evidence:
      - "frozen title authorship version and date"
      - "citation and colophon reconciliation"
      - "reader-facing changelog and errata state"
    required_exit_tests:
      - "All public metadata identify one accepted citable edition."
      - "Citation, changelog, colophon, and errata records agree."
    minimum_outputs: 2
  external_action:
    required_evidence:
      - "immediate action authorisation"
      - "exact target receipt"
      - "source and resulting remote identifier"
    required_exit_tests:
      - "Only the specifically authorised action is executed against the accepted source state."
      - "The resulting remote identifier or receipt is recorded and verified."
    minimum_outputs: 2
  release_record:
    required_evidence:
      - "public smoke-test report"
      - "artifact checksums"
      - "final register and ledger snapshot"
    required_exit_tests:
      - "Canonical pages, downloads, citation, changelog, and errata routes pass after deployment."
      - "Final checksums and workflow state match the released source."
    minimum_outputs: 2
