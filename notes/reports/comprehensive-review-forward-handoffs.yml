        gate: before_start
        state: consumed
        acknowledged_at: "2026-08-05"
        resolved_at: "2026-08-05"
        disposition: >-
          data/katalog.yml is created as the sole machine-readable data record
          and carries every field this handoff requires on every entry: source,
          version, licence, attribution, access, redistribution, lane, fallback
          and integrity. All four current and all thirteen proposed packages from
          the P1B inventory are registered with exactly the lane that inventory
          assigned, and the catalogue restates the three-lane contract verbatim,
          including that technical access is never redistribution authority. The
          catalogue fails closed by construction: the schema makes every required
          field mandatory, the validator rejects an unknown lane, a blank or
          not-applicable licence, a missing fallback and a missing integrity
          record, and it forbids promotion outright unless the lane is bundled,
          redistribution is verified, a checksum and an official reconciliation
          are recorded and files are listed. **Zero packages are promoted by this
          packet**: every entry carries promoted false and names the exact later
          gate that may promote it, so availability alone can promote nothing and
          no portal-mediated or external-only package can be promoted at all
          while its lane stands. UCBAdmissions and anscombe stay external-only
          with their lawful fallbacks recorded, as this handoff requires of
          P3-EXISTING. The P3-EXISTING delivery is before_start for that packet
          and correctly remains pending.
        evidence:
