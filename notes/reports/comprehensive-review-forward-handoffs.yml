  H-P3-DZS-004:
    source_packet: P3-DZS
    created_at: "2026-08-05"
    kind: constraint
    refs:
      - item:R08-DZS-package
      - source:data/dzs-putovanja-stanovnistva-2024.csv
      - source:data/katalog.yml#dzs_turizam-source_reconciliation
      - report:notes/reports/p3-dzs-2026-08-05.md
    statement: >-
      The package deliberately carries two numbers that measure different
      things. BS_TU11 and BS_TU12 are an ADMINISTRATIVE count of arrivals in
      commercial accommodation, sourced from eVisitor since 2017, and they
      reconcile at exactly zero. T03 is a SAMPLE SURVEY of Croatian residents'
      own travel, and it does NOT reconcile exactly: every published cell is a
      separately rounded estimate, so the parts need not sum to the total. The
      largest residual is exactly 1, in all three breakdowns - destination,
      duration and age group - and never larger; the closeout recomputed all 18
      comparisons and confirmed it. The residual is recorded rather than rounded
      away because it is a property of survey estimation, not an error.
    required_action: >-
      WA-C03 may not add a survey figure to an administrative figure, may not
      present the two as one series, and may not describe the +-1 residual as a
      mistake in the data. P5-C must not build a student route that asks for the
      two to be combined or that treats the residual as a failed check. P6-DATA
      must keep the declared reconciliation tolerance at 0 for the two
      administrative tables and must not widen it to make the survey pass under
      the same rule.
    basis:
      - check:closeout-recomputation-126-monthly-to-annual-comparisons-residual-0
      - check:closeout-recomputation-18-survey-comparisons-largest-residual-exactly-1
      - source:data/katalog.yml#dzs_turizam-source_reconciliation-declares-tolerance-0-for-the-counts-and-1-for-the-survey
      - source:data/dzs-turizam.LICENCA.md-states-the-two-units-and-the-rounding-property
    required: true
    deliveries:
      - target_packet: WA-C03
        gate: before_close
        state: consumed
        acknowledged_at: "2026-08-06"
        resolved_at: "2026-08-06"
        acknowledgement: >-
          WA-C03 will never add the DZS survey estimate to the administrative
          arrival count, present them as one series or call the survey's exact
          plus-or-minus-one rounding residual a data error.
        disposition: >-
          WA-C03 introduced neither the DZS administrative arrival count nor the
          DZS survey estimate. It added, combined and plotted neither quantity,
          and made no claim about the survey's plus-or-minus-one rounding
          residual. The governed generated offline exercise remains separate
          from both DZS series.
        evidence:
          - "report:notes/reports/p3-dzs-2026-08-05.md#ostatak-koji-se-biljezi-a-ne-zaokruzuje"
          - "source:data/dzs-putovanja-stanovnistva-2024.csv"
