        gate: before_close
        state: consumed
        acknowledged_at: "2026-08-05"
        resolved_at: "2026-08-05"
        disposition: >-
          P3-EXISTING acknowledged this delivery before its first substantive
          edit and consumed it at closeout with a separate decision on each of
          the three items it names for this packet, taken one at a time against
          that item's own acceptance test and never by aggregation.
          **R25-CATALOG-storage is closed.** Two packages now have materialised
          files, both pass all six storage conventions, and each convention is
          machine-enforced rather than asserted; the applicable scope is
          recorded in the item rather than implied.
          **R25-CATALOG-validation is closed on both halves, not on the first.**
          The catalogue half already stood on ten fixtures; the accepted-package
          half now has two accepted packages recording a checksum with its
          algorithm and an official reconciliation, and every data-level defect
          class the review lists is exercised against bytes on disk. Each
          fixture must print its own rule's message, so a fixture that failed
          for an unrelated reason could not be credited.
          **R32-CATALOG-paired-views is deliberately NOT closed.** Its first
          half is discharged -- both pairs exist and reconcile without tolerance
          -- but its test also requires at least one task that reproduces an
          aggregate, and a task is reader prose that a data_package packet may
          not write. The aggregates were built so that such a task is possible
          by hand, with a numerator and denominator beside every share and an
          integer total beside every mean, but building the possibility is not
          writing the task. H-P3-EXISTING-002 carries that half to WB-C04,
          WC-C09, WC-C11 and P5-C. The three items this handoff assigns to P5-C
          and P7-CLEAN-BUILD were not touched: R25-CATALOG-single-source and
          R25-CATALOG-passport still need the generated views and a chapter's
          first use, and R08-CATALOG-local-independence still needs a
          fresh-clone render this packet did not run and does not claim.
        evidence:
