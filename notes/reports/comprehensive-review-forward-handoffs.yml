      - report:notes/reports/g-a3-digikat-selection-decision-2026-08-10.md#provjera-izvatka-tri-stvarna-nedostatka
      - verification:denominator-identity-6-of-6-years-exact
      - verification:annual-monthly-divergence-17-of-49-net-zero-at-710307
      - verification:months-2024-02-to-2024-05-absent-and-2024-01-partial
    required: true
    deliveries:
      - target_packet: P3-VERIFY-B
        gate: before_close
        state: consumed
        acknowledged_at: "2026-08-10"
        resolved_at: "2026-08-10"
        disposition: >-
          P3-VERIFY-B independently recomputed the three required repairs from
          the committed DigiKat CSVs and then verified them from the named
          source checkout. Complete years are exactly 2021, 2022, 2023 and
          2025; February-May 2024 are absent and January carries 1911 posts;
          lom_metode carries the actual TikTok, 2024-06 and Instagram states.
          Annual versus monthly divergence is 17 of 49, +446 to -389, net zero
          at 710307 in both files. All six annual denominators reconcile with
          tolerance zero, while the domain-only source file carries 551712
          posts. The defects are repaired in machine-checked data, not merely
          described, and every downstream claim boundary remains unchanged.
