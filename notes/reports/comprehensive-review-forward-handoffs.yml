        disposition: >-
          Consumed on the registry side, which is the only side P2-SPINE-V owns.
          The recorded risk was that the review's sample critical-literacy route
          skips Chapter 13 while the same review requires Chapter 13's
          conditional-denominator and confusion-table foundations before Chapter
          17. G-A2b-V settled that contradiction in favour of the prerequisite,
          and this packet made the settlement live: Chapter 17's ratified
          prerequisites are written into chapter-spine.json as Chapters 2, 3, 8,
          10, 11, 13 and 16, so Chapter 13 is now a machine-checkable
          prerequisite of Chapter 17, and Chapter 17's first ratified exclusion
          states both that the chapter may not be read without Chapter 13 and
          that no advertised route may send a reader into Chapter 17 without
          Chapter 13. The deterministic checker enforces the same order twice
          over, as a prerequisite that may not point at a later unit and as a
          ratification-order condition, so Chapter 17 could not be ratified
          before Chapter 13. The required action to ratify Chapter 17's exact
          prerequisites before publishing either route is therefore discharged
          here. The route half of the required action is not discharged here and
          was deliberately not claimed: this packet publishes and amends no
          route. It remains this handoff's open delivery to P5-ROUTES, and
          H-P2-SPINE-V-002 carries the exact route obligation forward so the
          amendment cannot be lost. The illustrative route was never copied
          mechanically anywhere in this packet.
