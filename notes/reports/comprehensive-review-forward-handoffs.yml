  H-G-A3-DZS-001:
    source_packet: G-A3-DZS
    created_at: "2026-08-05"
    kind: decision
    refs:
      - decision:G-A3-DZS
      - item:R08-DZS-package
      - handoff:H-P1B-DATA-LIC-003
      - handoff:H-P3-CATALOG-001
      - registry:data/katalog.yml#dzs_turizam
      - report:notes/reports/g-a3-dzs-selection-decision-2026-08-05.md
    statement: >-
      Author and editor Luka Sikic accepted the DZS selection as recommended on
      2026-08-05. The bounded extract is BS_TU11 as a complete-year national
      monthly arrivals and overnights series, one BS_TU12 county cross-section
      and a bounded T01-T03 long extract, with totals and suppression codes
      retained and annual and monthly rows kept separate so they cannot be double
      counted. The full DZS stack stays external. The snapshot year is the latest
      possible, read as the most recent COMPLETE calendar year DZS has published
      at the moment of retrieval, pinned by exact edition and retrieval date; an
      incomplete current year is excluded. The gate deliberately names no year,
      because a gate that retrieves nothing cannot verify what has been published.
      The lane stays bundled on the general basis that DZS publishes its online
      datasets under the Croatian Open Licence and on the author's 2026-08-05
      determination, but that basis is general and NOT an exact package record,
      so the gate ratified the lane and the selection and explicitly withheld
      promotion. The package serves Chapter 3 as one traceable public claim;
      permissible claims are description of recorded arrivals and overnights and
      comparison of periods under one definition, and causation, any conclusion
      about an individual guest, and any comparison mixing annual with monthly
      rows or two geographic levels without naming the denominator are
      unavailable.
    required_action: >-
      P3-DZS must build exactly this bounded selection and no more. It must pin
      the most recent complete calendar year at retrieval and record the exact
      edition, retrieval date, attribution string including the source, the
      last-modified date, the URI and a change marker, the checksum, and the
      reconciliation to the official published totals, writing all of it into the
      dzs_turizam entry in data/katalog.yml before it sets promoted true. It must
      keep totals and suppression codes, must not merge annual and monthly rows,
      and must not silently widen the extract. If the latest complete year is not
      published in a form this selection admits, it must STOP and return the
      question to G-A3-DZS rather than lower the criterion itself. It may claim no
      rights-holder permission, because none was sought, and it must leave the
      recorded lawful fallback in place until the package actually passes.
    basis:
      - conversation:G-A3-DZS-selection-approved-2026-08-05-Luka-Sikic
      - notes/reports/g-a3-dzs-selection-decision-2026-08-05.md
      - notes/reports/author-pre-dispositions-2026-08-05.md#dzs-turizam-godina-snimke
      - notes/reports/p1b-data-licence-access-inventory-2026-08-03.md#mjerodavni-izvori
      - notes/reports/g-a3-data-rights-determination-2026-08-05.md
      - registry:data/katalog.yml#dzs_turizam-lane-bundled-promoted-false
    required: true
    deliveries:
      - target_packet: P3-DZS
        gate: before_start
        state: consumed
        acknowledged_at: "2026-08-05"
        resolved_at: "2026-08-05"
        disposition: >-
          P3-DZS consumed this delivery BEFORE the packet claim and before its
          first substantive edit, and it is the only delivery targeting this
          packet. The bounded selection is built and nothing beyond it. BS_TU11
          enters as a complete-year national monthly series, restricted to
          2005-2025 because 2026 carries only five of twelve months; BS_TU12
          enters as one county cross-section at 2025. The snapshot year is
          pinned by retrieval rather than by the packet date: the retrieval date
          of record is 2026-07-27, the date the author's local mirror was
          downloaded from the DZS PxWeb API, and the most recent COMPLETE
          calendar year published at that retrieval is 2025 in both tables,
          12 of 12 months with no missing cell. The packet did NOT have to stop
          and return the year question, because the latest complete year is
          published in exactly the form the selection admits.
          The third member could NOT be built as ratified and the packet did not
          silently substitute. `T01`-`T03` is not a unique identifier in the DZS
          tourism database and no viable set exists under it: the household
          survey T01 ends at 2019, T02 reaches 2024 with 44 per cent of its 2024
          cells empty, and the coastal-town BS_T01-BS_T03 tables carry roughly 55
          per cent empty rows because they list every settlement including inland
          ones. The packet returned the narrowing to the author, who confirmed on
          2026-08-05 the household-survey T03 at 2024 - trips, nights and
          expenditure by age group - and the accepted G-A3-DZS selection is
          amended accordingly and explicitly in decisions.G-A3-DZS.amendments,
          not overwritten. That table is a SURVEY of Croatian residents against
          BS_TU11's ADMINISTRATIVE count, which is the contrast Chapter 3 needs.
          The exact package record is written into the dzs_turizam entry before
          promoted became true: edition, the 2026-07-27 retrieval date, the
          Croatian Open Licence attribution string carrying source,
          last-modified date, URI and change marker, an MD5 per declared file
          with its algorithm named, and a machine-checked reconciliation.
