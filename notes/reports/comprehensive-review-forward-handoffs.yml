  H-WB-C06-001:
    source_packet: WB-C06
    created_at: "2026-08-10"
    kind: invalidation
    refs:
      - source:scripts/widget-parity-ojs.mjs#normal
      - source:chapters/06-povezanost.qmd#w06-scenariji
      - registry:data/widgets.json#w06
      - report:notes/reports/wb-c06-2026-08-10.md#interakcija-tisak-i-pristupacnost
    statement: >-
      The shared JavaScript parity adapter's normal generator discards the
      second polar variate, while the live d3.randomNormal implementation used
      by several chapter widgets caches and returns that second variate on the
      next call. The adapter therefore does not execute the same pseudorandom
      stream as the live widget even when a wide distributional tolerance lets
      the parity gate pass. Chapter 6 was repaired locally by using an explicit
      matching non-caching generator in the live widget; its actual browser
      correlations are -0.8267702151, -0.4172254838, 0.5577954416 and
      0.7177682430, and the registered R twin remains within the existing 0.20
      contract. The same adapter risk remains for w05, w09, w10, w11, w14, w16
      and w17.
    required_action: >-
      Each target chapter packet must establish exact live-source and adapter
      generator equivalence, or replace both sides with one explicitly matching
      generator. It must add actual-execution golden values or fingerprints and
      a regression fixture that fails when the cached second polar variate is
      consumed on only one side, then revalidate the named widget without
      widening its tolerance. P6-FIGURES and P7-HTML must treat the affected
      widget evidence as needing this revalidation before whole-book figure or
      browser proof closes.
    basis:
      - "diagnostic:scripts/widget-parity-ojs.mjs-normal-discards-second-polar-variate"
      - "browser:w06-live-correlations-minus-0.8267702151-minus-0.4172254838-0.5577954416-0.7177682430"
      - "source:chapters/06-povezanost.qmd-explicit-noncaching-polar-generator"
      - "check:scripts/check-widget-parity.py-WIDGET_PARITY_OK-pairs-17-with-existing-contract"
      - "boundary:no-tolerance-widening"
