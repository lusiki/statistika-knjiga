  H-G-A1A-001:
    source_packet: G-A1a
    created_at: "2026-08-03"
    kind: decision
    refs:
      - decision:G-A1a
      - decision:D01
      - item:R01-C10-null-exchangeability
      - item:R01-C10-monte-carlo-correction
      - item:R01-C10-bayesian-balance
    statement: >-
      The author and named statistical reviewer Luka Sikic jointly approved
      D01 on 2026-08-03. Chapter 10 retains a two-sided raw difference-in-means
      permutation statistic only for an exchangeability/full-distribution
      null, names its assumptions and observational claim boundary, uses
      (b + 1) / (B + 1) for finite random-permutation p-values, requires a true
      full-distribution null for the type-I-error demonstration, and balances
      the bounded frequentist/Bayesian comparison. The analytic normal-p-value
      widget and print twin are revalidated but do not receive a permutation
      correction unless deliberately converted to permutation algorithms.
    required_action: >-
      In P1A-C10, implement the accepted specification without changing the
      chapter's simulation-first role. Reproduce every affected result from a
      clean session, obtain independent methods evidence on the corrected
      source state, run the required style and targeted render checks, and do
      not start P1A-C11.
    basis:
      - conversation:joint-G-A1a-approval-2026-08-03-Luka-Sikic
      - notes/reports/comprehensive-review-implementation-plan-2026-08-03.md#2-ratified-defaults
      - notes/reports/comprehensive-book-review-2026-07-31.md#10-logika-testiranja
      - notes/reports/comprehensive-review-implementation-register.yml#G-A1a
    required: true
    deliveries:
      - target_packet: P1A-C10
        gate: before_start
        state: consumed
        acknowledged_at: "2026-08-03"
        resolved_at: "2026-08-03"
        disposition: >-
          P1A-C10 accepts the jointly approved D01 specification as its exact
          and exclusive correction scope. The packet will retain the two-sided
          raw difference in means only for an exchangeability/full-distribution
          null, name the independent-unit, exchangeability, observational, and
          noncausal boundaries, use (b + 1) / (B + 1) for every finite random-
          permutation p-value, replace the invalid nearly-equal-means type-I
          demonstration with a true full-distribution null, leave the analytic
          normal-p-value widget and print twin outside the permutation
          correction, and balance the bounded Bayesian contrast. No P1A-C11 or
          unrelated Chapter 10 work is admitted.
        evidence:
          - decision:conversation:joint-G-A1a-approval-2026-08-03-Luka-Sikic
          - register:G-A1a-accepted-specification
          - check:scripts/check-review-workflow.R-preclaim-at-eb4b58b
          - scope:chapters/10-logika-testiranja.qmd-and-three-P1A-C10-items-only
          - chapter:sha1-a90549950c4f410f757bdec9b6ac680380ab7662
          - report:notes/reports/p1a-c10-methods-review-2026-08-03.md
          - critic_methods:pass-source-a90549950c4f410f757bdec9b6ac680380ab7662
          - check:clean-session-style-structure-figure-and-targeted-render-passed

  H-G-A1B-001:
    source_packet: G-A1b
    created_at: "2026-08-03"
    kind: decision
    refs:
      - decision:G-A1b
      - decision:D02
      - item:R02-C14-welch-ols
      - item:R02-C15-dependent-revalidation
      - item:R02-C16-dependent-revalidation
    statement: >-
      The author and named statistical reviewer Luka Sikic jointly approved
      D02 on 2026-08-03. Chapter 14 retains Welch inference as its default and
      tests the two-sided population mean-difference null. The binary-predictor
      OLS coefficient equals the raw difference in sample means, but ordinary
      homoskedastic OLS uses pooled uncertainty and n1 + n2 - 2 residual
      degrees of freedom, whereas Welch uses group-specific variances and
      Welch-Satterthwaite degrees of freedom. The seeded sample reproduces the
      same estimate, 1.185714, but Welch gives SE 0.372609 and df 102.471 while
      ordinary OLS gives SE 0.369537 and df 118. The two-decimal intervals
      happen to match after rounding and cannot support an identity claim.
    required_action: >-
      In P1A-C14, source the default interval and test from Welch, use lm only
      to establish the point-estimate/model connection or as an explicitly
      labelled homoskedastic contrast, state the exact null, standard-error,
      degrees-of-freedom, assumption, and observational boundaries, and remove
      the false same-interval/inferential-identity claim. Reproduce every
      affected value from a clean session, obtain independent methods evidence
      on the corrected source state, run required style and targeted render
      checks, leave the widget and unrelated Chapter 14 material unchanged,
      and do not start P1A-C15.
    basis:
      - conversation:joint-G-A1b-approval-2026-08-03-Luka-Sikic
      - notes/reports/comprehensive-review-implementation-plan-2026-08-03.md#2-ratified-defaults
      - notes/reports/comprehensive-book-review-2026-07-31.md#14-dvije-grupe
      - notes/reports/comprehensive-review-implementation-register.yml#G-A1b
    required: true
    deliveries:
      - target_packet: P1A-C14
        gate: before_start
        state: consumed
        acknowledged_at: "2026-08-03"
        resolved_at: "2026-08-03"
        disposition: >-
          P1A-C14 accepts the jointly approved D02 specification as its exact
          and exclusive correction scope. The packet will retain Welch
          inference as the default for the two-sided population mean-difference
          claim, preserve the exact point-estimate identity with a binary-
          predictor coefficient, distinguish Welch group-specific uncertainty
          and Welch-Satterthwaite degrees of freedom from ordinary pooled
          homoskedastic OLS uncertainty, expose the reproduced SE and df
          difference, and retain the stated assumptions and observational
          boundary. The widget, print twin, paired comparison, Wilcoxon
          discussion, standardized effect, confounding example, Chapters 15
          and 16, and all unrelated material remain outside this packet.
        evidence:
          - decision:conversation:joint-G-A1b-approval-2026-08-03-Luka-Sikic
          - register:G-A1b-accepted-specification
          - scope:chapters/14-dvije-grupe.qmd-and-R02-C14-welch-ols-only
          - authority:P1A-C14-only-no-P1A-C15-or-later-packet

