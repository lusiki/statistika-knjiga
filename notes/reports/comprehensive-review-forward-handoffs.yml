      mechanisms, record Luka Sikic as the accountable release, archive, and
      errata owner, demonstrate their fields and state transitions without
      publication, and preserve the D14 working-title boundary. Do not freeze
      final release metadata, perform any external action, accept a later
      release gate, or infer authority across actions.
