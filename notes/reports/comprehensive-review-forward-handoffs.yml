      fallback to four existing and thirteen proposed packages. Technical
      access is not redistribution authority, and data/katalog.yml was
      intentionally not created before P3-CATALOG.
    required_action: >-
      P3-CATALOG must create the sole machine-readable record with required
      source, version, licence, attribution, access, redistribution, lane,
      fallback, and integrity fields. It must fail closed and must not promote
      a portal-mediated or external-only package from availability alone.
      P3-EXISTING must keep UCBAdmissions and anscombe external-only unless it
      obtains authoritative dataset-specific redistribution evidence.
