    statement: >-
      Two data validators are not blocking CI steps, and the gap is recorded
      rather than quietly accepted. scripts/check-data-integrity.R is already a
      blocking step, so the data-level rules this packet added run in CI for
      free. scripts/check-katalog.py has never been wired into
      .github/workflows/publish.yml, not by P3-CATALOG that created it and not
      by this packet, and the new scripts/check-data-fixtures.py is not wired
      either. A catalogue defect, a checksum mismatch or an undeclared consumer
      would therefore pass CI today and be caught only by a local run. This
      packet deliberately did not edit the workflow: the release path is owned
      by the P1C packets that proved its failure modes, and .github is outside
      this packet's declared owned paths.
    required_action: >-
      P7-CLEAN-BUILD must add scripts/check-katalog.py and
      scripts/check-data-fixtures.py to the blocking check ladder in
      .github/workflows/publish.yml, before the PDF and HTML render steps and
      with no continue-on-error, and must prove the negative fixtures still fail
      from a clean environment. P6-DATA must not treat a local pass as CI
      coverage while this remains open. This is the same shape as
      H-P2-DOCS-003, which carries the terminology checker's wiring to the same
      packet, and the two should be wired together.
