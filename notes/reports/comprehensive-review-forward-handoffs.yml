      - item:R24-C18-privacy-sources
      - item:R24-C18-dated-policy
      - item:R24-BOOK-dated-legal-claims
    statement: >-
      Course owner Luka Sikic recorded the D15 privacy, disclosure, and tool
      lanes on 2026-08-04 as the course's own dated conservative policy, not as
      adoption of an external regulation. The applicable institution is
      Hrvatsko katolicko sveuciliste as the course's home institution. The
      policy source is the course policy for this book, version 1.0, as of
      2026-08-04, published in full in Appendix F and referenced by Chapter 18.
      It is not a university regulation and may not be cited as one; no
      external legal or institutional document is named. Three lanes are
      approved: public tools for published, licence-cleared, simulated,
      synthetic, and teaching-aggregate data only; contractually protected
      tools for pseudonymised working data under a written agreement excluding
      training on input and fixing retention; and institutionally approved
      local tools with no data egress for restricted data within its own access
      conditions.
    required_action: >-
      In P5-F, write Appendix F with the three distinct lanes and their exact
      conditions, the dated policy block, the disclosure statement text, and a
      model-independent protocol, and audit every exercise so none requires
      sending personal, identifiable, restricted, or non-shareable data to any
      lane; each such task must ship a safe supplied-data alternative. In
      WE-C18, frame respondent privacy as this dated policy and keep policy,
      legal description, and empirical reidentification evidence distinct. In
      P6-EVIDENCE, apply the as-of/source rule to every legal, institutional,
      and product claim. No packet may invent an external policy title, link,
      or version; if an external source is ever needed, stop and return for a
      new owner disposition.
    basis:
      - conversation:G-A2d-policy-decisions-approved-2026-08-04-Luka-Sikic
      - decision:D15
