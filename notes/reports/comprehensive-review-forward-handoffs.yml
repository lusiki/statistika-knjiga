        resolved_at: "2026-08-10"
        disposition: >-
          P3-DIGIKAT accepts the complete approved digikat_mediji boundary
          before claim: it owns only the three aggregate extracts and their
          catalogue, schema, validator, fixture, passport and promotion
          evidence; it will repair D-1, D-2 and D-3, implement the three-part
          non-official reconciliation substitute, retire digikat_akteri with a
          successor pointer, register WB-C04 through WB-C06, and verify the
          pinned local checkout without reading the master corpus or using the
          network. The 2026-07-22 source date of record and the prohibition on
          rights-holder-permission claims remain unchanged.
        evidence:
