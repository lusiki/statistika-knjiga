          - "check:INDEPENDENT_DIGIKAT_OK-49-438-3604-divergent-17-net-0"
          - "check:DIGIKAT_RECONCILIATION_OK-years-6-denominator-tolerance-0"
          - "source:data/digikat-izvori.csv-denominator-551712"
      - target_packet: WB-C05
        gate: before_start
        state: consumed
        acknowledged_at: "2026-08-10"
        resolved_at: "2026-08-10"
        disposition: >-
          Before claiming WB-C05, the packet bound the verified DigiKat limits
