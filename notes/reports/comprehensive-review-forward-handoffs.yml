          - "check:INDEPENDENT_DIGIKAT_OK-49-438-3604-divergent-17-net-0"
          - "check:DIGIKAT_RECONCILIATION_OK-years-6-denominator-tolerance-0"
          - "source:C:/Users/lsikic/projects/DigiKat@278a127f9170c1aca82035a4a8357b8a995f91d8"
          - "check:DATA_NEGATIVE_FIXTURES_OK-cases-44"
      - target_packet: WB-C04
        gate: before_start
        state: consumed
        acknowledged_at: "2026-08-10"
        resolved_at: "2026-08-10"
        disposition: >-
          Before claiming WB-C04, the packet bound the verified DigiKat limits
          to its source and review scope. It will make no growth or trend claim
          across 2024, no before/after-June-2024 comparison without the method
          break, no source-file share against any denominator other than
          551712, and no interaction or reach comparison between measured and
          unmeasured platforms. The Chapter 4 distribution slice may use only
          the independently verified source-table quantities, with structural
          missingness kept distinct from measured zero.
        evidence:
