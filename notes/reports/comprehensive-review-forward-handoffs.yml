      podaci.qmd and dodaci/c-katalog-podataka.qmd are still hand-maintained; the
      catalogue is nevertheless the sole machine-readable record and was verified
      not to contradict them. R25-CATALOG-passport needs a passport shown before
      a chapter's first use of a package. R32-CATALOG-paired-views needs an
      analysis file and an aggregate that reconcile at full precision.
      R25-CATALOG-storage needs at least one applicable package, and there are
      zero snapshots. R25-CATALOG-validation has its catalogue half proved by ten
      deliberate fixtures but its accepted-package half has no accepted package.
      R08-CATALOG-local-independence needs a fresh-clone validate and render,
      which this packet did not run and therefore does not claim; the catalogue
      introduces no dependency on CroAIcon or any sibling repository.
    required_action: >-
      P3-EXISTING must close R25-CATALOG-storage and the accepted-package half of
      R25-CATALOG-validation once it registers real files with their checksums
      and source reconciliation. P5-C must close R25-CATALOG-single-source and
      R25-CATALOG-passport by generating both public views and the pre-use
      passport from data/katalog.yml as the single source, and together with
      P3-EXISTING must close R32-CATALOG-paired-views. P7-CLEAN-BUILD must close
      R08-CATALOG-local-independence from a fresh clone or clean worktree. No
      packet may close any of the six by aggregation or by treating the
      catalogue's own internal consistency as evidence about files, views or
      renders that do not exist.
