  H-G-A2A-001:
    source_packet: G-A2a
    created_at: "2026-08-04"
    kind: decision
    refs:
      - decision:G-A2a
      - item:R10-CLAIMS-six-dimensions
      - item:R10-AUDIT-six-questions
      - item:R10-LIFECYCLE-stable
      - item:R10-THREAD-seven-map
      - item:R10-DS-workflow-scope
      - item:R24-BOOK-four-activities
      - item:R24-BOOK-ordinary-ethics
      - item:R24-EVIDENCE-four-objects
      - item:R08-DESIGN-policy
      - item:R08-PORTFOLIO-text-priority
      - item:R12-POLL-card
      - item:R17-REPORT-honest-standard
      - item:R19-SENSITIVITY-standard
    statement: >-
      Author and editor Luka Sikic approved the complete G-A2a governing system
      as recommended on 2026-08-04. The book adopts six claim dimensions, six
      recurring audit questions, one stable nine-stage lifecycle with ratified
      part-level roles, seven plant/develop/harvest threads including the
      seventh communication thread, the four-activity definition with data
      science as a delivery mechanism rather than a fifth promise, the eight
      data-generating designs with text priority over the optional World Bank
      extension, the four evidence objects, ordinary-practice ethics, and the
      honest-sentence, sensitivity, and poll-card standards. The approximate
      70/20/10 attention budget is an editorial diagnostic only and is not a
      binding constraint any packet may cite to require or refuse content. The
      additions justify no new numbered chapter, central widget, or callout
      type.
    required_action: >-
      In P2-CLAIMS, write the canonical claim, lifecycle, thread, ethics, and
      data-science architecture registries to exactly this accepted system.
      Record explicit plant/develop/harvest roles and exclusions for every
      thread, keep the 70/20/10 budget marked non-binding wherever it is
      represented, and preserve the scope-control rule that a thread receives a
      seed, one substantial harvest, and later retrieval. Do not edit chapter
      prose, ratify a chapter spine, select or promote a data package, settle
      the assessment contract, or resolve Chapter 17 prerequisites; each
      retains its own later gate.
    basis:
      - conversation:G-A2a-governing-system-approved-2026-08-04-Luka-Sikic
      - notes/reports/comprehensive-review-implementation-register.yml#G-A2a
      - notes/reports/comprehensive-review-implementation-register.yml#OA-G-A2A-CLAIM-SYSTEM
