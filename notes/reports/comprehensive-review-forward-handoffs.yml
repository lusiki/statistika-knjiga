  H-P3-DZS-001:
    source_packet: P3-DZS
    created_at: "2026-08-05"
    kind: constraint
    refs:
      - item:R08-DZS-package
      - source:data/katalog.yml#dzs_turizam-unit
      - report:notes/reports/p3-dzs-2026-08-05.md
    statement: >-
      The unit of the monthly and annual DZS tourism files is a recorded
      ARRIVAL, not a person. One traveller who stays in three places in one trip
      is counted three times, and the published national total is the sum of
      those arrivals. This is not a defect of the extract and not a caveat the
      book invents: it is a documented property of the official statistic, and
      it is the reason the package is worth teaching. The county cross-section
      inherits the same unit. The extract preserves it and never converts an
      arrival into a visitor, a tourist or a person.
    required_action: >-
      WA-C03 may not describe any figure from data/dzs-turizam-mjesecno.csv,
      data/dzs-turizam-godisnje.csv or data/dzs-turizam-zupanije-2025.csv as a
      number of people, visitors or tourists, and may not divide it by
      population to obtain a per-capita rate of persons. Where the chapter needs
      the word "turist" it must be tied to the arrival, not to the human being.
      Any later packet that reuses this package inherits the same bar.
    basis:
      - source:data/katalog.yml#dzs_turizam-unit-jedan-objavljeni-redak-sluzbene-tablice-zabiljezeni-DOLAZAK-ne-osoba
      - source:DZS-BS_TU11-and-BS_TU12-publish-dolasci-and-nocenja-as-counts-of-events
      - check:closeout-recomputation-21-county-rows-sum-to-the-national-arrival-total-with-residual-0
    required: true
    deliveries:
      - target_packet: WA-C03
        gate: before_close
        state: consumed
        acknowledged_at: "2026-08-06"
        resolved_at: "2026-08-06"
        acknowledgement: >-
          WA-C03 will treat every DZS tourism value as a recorded arrival rather
          than a person, create no per-capita person rate and use the promoted
          package only as the governed offline fallback.
        disposition: >-
          WA-C03 used no DZS tourism value in Chapter 3 prose or calculations.
          It therefore converted no arrival into a person, visitor or tourist
          and created no per-capita person rate. Its mandatory offline exercise
          instead uses the governed generated populacija_medija package, whose
          unit is explicitly a generated person in a fictional city.
        evidence:
          - "report:notes/reports/p3-dzs-2026-08-05.md#odlazna-prosljedivanja"
          - "registry:data/katalog.yml#dzs_turizam-unit"
          - "registry:data/katalog.yml#populacija_medija-consumers-WA-C03"
          - "source:chapters/03-kako-brojke-zavode.qmd@sha256-11e949a5f4bfa3f762a6b3ad4f2f3e6a36333cdd2fbfae08103d2fcd8263bad5"
          - "report:notes/reports/wa-c03-2026-08-06.md#dolazne-isporuke"

