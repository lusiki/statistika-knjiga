  H-P3-DZS-003:
    source_packet: P3-DZS
    created_at: "2026-08-05"
    kind: constraint
    refs:
      - item:R08-DZS-package
      - source:scripts/check-katalog.py
      - source:scripts/check-data-integrity.R
      - report:notes/reports/p3-dzs-2026-08-05.md
    statement: >-
      The first external package tightened the promotion contract in six ways
      that generated datasets could never have exposed, and every later external
      package inherits all six. A decision gate may no longer be the
      promoting_gate of a promoted package, because a gate that retrieves
      nothing cannot check the bytes it would stand behind; moving the promoting
      gate requires promoting_gate_ratified_by naming a different, existing
      decision record on disk; the promotion log now carries the NAMES of
      promoted packages and is compared in both directions against promoted_by.
      The snapshot-notice check now reads the package's OWN licence_uri instead
      of demanding a CC BY 4.0 link, because demanding one of a Croatian Open
      Licence source would have forced a false licence into a licence notice. A
      key may be several columns joined by "+", so a published cross-tabulation
      is identified by its dimensions rather than by an invented surrogate. A
      declared missing-value code is checked for its own presence and then set
      aside, while an UNDECLARED absence code in the same column fails.
    required_action: >-
      P3-DIP, P3-DIGIKAT, P3-EUROSTAT and P3-TEXT must satisfy all six rules
      before promoting anything; none may reintroduce a decision gate as its own
      promoter, and none may pass the notice check by printing a licence it does
      not hold. P6-DATA must treat these rules as the standing contract for the
      whole data portfolio and may not relax one to admit a package.
    basis:
      - source:scripts/check-katalog.py-DECISION_GATE-may-not-be-the-promoting-gate-of-a-promoted-package
      - source:scripts/check-katalog.py-promotion-log-names-packages-and-is-compared-in-both-directions
      - source:scripts/check-katalog.py-and-scripts/check-data-integrity.R-read-the-package-licence_uri
      - source:data/katalog.schema.json#fileRecord-key-pattern-allows-composite-keys
      - fixture:scripts/check-data-fixtures.py-DATA_NEGATIVE_FIXTURES_OK-cases-41
    required: true
    deliveries:
      - target_packet: P3-DIP
        gate: before_close
        state: consumed
        acknowledged_at: "2026-08-05"
        resolved_at: "2026-08-05"
        disposition: >-
          P3-DIP applied all six rules without pretending that an unpromoted
          portal route is a promoted package. dip_2024 remains portal-mediated,
          promoted false, promoted_by null, files empty, checksum null, and
          absent from the promotion log. Its decision-gate promoting_gate was
          removed rather than moved, so promoting_gate_ratified_by is neither
          needed nor invented. No snapshot notice exists because no snapshot
          exists; the published-terms status is recorded in the catalogue and
          passport instead of forcing CC BY 4.0 or another licence. The
          source-exposed key is the electoral-unit label; XII's six published
          minority rows are recorded as a structural asymmetry. No missing code
          appears in the inspected official table and no claim is made about the
          uninspected archive. The general composite-key, own-licence notice,
          declared-missing-code, ratification-record, and bidirectional
          promotion-log checks remain unchanged for packages to which they
          apply.
        evidence:
          - "report:notes/reports/p3-dip-2026-08-05.md#sest-pravila-iz-h-p3-dzs-003"
          - "registry:data/katalog.yml#dip_2024-portal-mediated-promoted-false-files-empty-checksum-null"
          - "passport:data/dip_2024/PUTOVNICA.md"
          - "check:scripts/check-katalog.py-KATALOG_OK-promoted-3"
          - "check:scripts/check-dip-portal.py-DIP_PORTAL_OK-local_files-0-checksum-null"
          - "fixture:DIP_PORTAL_NEGATIVE_FIXTURE-six-cases-each-exit-1"
      - target_packet: P3-DIGIKAT
        gate: before_close
        state: consumed
