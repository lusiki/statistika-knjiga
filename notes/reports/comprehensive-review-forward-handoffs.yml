      - report:notes/reports/g-a3-digikat-selection-decision-2026-08-10.md
    statement: >-
      The corpus is not uniform through time and the chapters may not treat it
      as if it were. Volume holds near 7000 posts a month across 2021 to 2023
      and then runs between 8458 and 26155 from June 2024 onward. Platform
      coverage grows from seven to nine. February through May 2024 are absent
      entirely, January 2024 is partial at 1911 posts, and June 2026 at 7815
      against May's 20471 is consistent with a truncated final month. The annual
      and monthly files also disagree in 17 of 49 platform-year cells, netting
      exactly zero at 710307 posts. Separately, the source file's 3604 rows
      carry 551712 of those 710307 posts, or 77.67 per cent, because the naming
      filter keeps only bare domains. The figures Chapter 4 will use were
      recomputed independently at this gate and agree with the reconnaissance:
      3604 sources, mean 153.08, median 4, ratio 38.27, largest hkm.hr at 56500,
      30.22 per cent with exactly one post, top ten at 26.96 per cent, 515
      sources with zero reach and 1367 with zero interactions.
    required_action: >-
      WB-C04, WB-C05 and WB-C06 may make no growth or trend claim across 2024
      and no comparison of periods before and after June 2024 without stating
      the method break. Any monthly display must show the 2024 gap rather than
      interpolate, smooth or silently drop it; the gap is teaching content and
      concealing it would be the failure the book exists to teach against. Any
      share computed from the source file must name 551712 rather than 710307 as
      its denominator. No chapter may compare interactions or reach between a
      platform with measurement and one without, because zero there is not a
      measured zero. P3-VERIFY-B must confirm that the three defects were
      repaired rather than described.
