      ladder and the H10 assessment boundary as recommended on 2026-08-04.
      Computation remains delegable; from the end of Part I every
      assistant-using task requires a readable verification receipt naming what
      was asked, what was returned, what was checked, and how. Assessment
      targets judgment rather than code production, the Part I no-visible-code
      rule stands with hidden plumbing permitted, and the three roles of AI -
      instrument, fallible analyst, and object of research - are retained.
    required_action: >-
      In P2-ASSESS, encode the competence ladder around task specification,
      validation, alternatives, provenance, and responsibility rather than
      syntax, give every substantive AI appearance an explicit role with human
      responsibility preserved, and admit no assessed code-production task. In
