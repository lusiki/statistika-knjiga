schema_version: 1
ledger: comprehensive-review-forward-handoffs
register: notes/reports/comprehensive-review-implementation-register.yml
last_updated: "2026-08-03"
inventory_child_count: 371

protocol:
  immutable_identity_fields:
    - id
    - source_packet
    - created_at
    - kind
    - statement
    - basis
  kinds: [constraint, prerequisite, evidence, risk, decision, invalidation]
  gates: [before_start, before_close]
  delivery_states: [pending, acknowledged, consumed, waived, superseded]
  terminal_delivery_states: [consumed, waived, superseded]
  rules:
    - A required before_start delivery must be terminal before its target packet is claimed.
    - A required before_close delivery must be acknowledged before the first substantive edit and terminal before closeout.
    - Consumed requires a concrete disposition and evidence; acknowledgement alone is not consumption.
    - Waived requires author approval and a reason.
    - Superseded requires the stable replacement handoff ID.
    - Unknown or TBD target packets are forbidden.
    - Accepted packets require a packet review declaring all future effects recorded.
    - Consequential discoveries are recorded here and never left only in chat.

