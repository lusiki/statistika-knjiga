      - report:notes/reports/g-a3-digikat-selection-decision-2026-08-10.md
    statement: >-
      Author, editor, data-policy owner and source project lead Luka Sikic
      accepted on 2026-08-10 the package digikat_mediji as the recommended
      portable aggregate: three files with no named individual, 49 annual
      platform rows, 438 monthly platform rows and 3604 source rows, derived
      from three of the project's fourteen tracked aggregate tables. The master
      corpus was not read and stays external-only as determ_korpus. Rights are
      resolved from the source's own published record rather than inferred: the
      project's DATA_AVAILABILITY.md places data/processed/*.rds under CC BY 4.0
      as aggregates with no personal data, and because the book's author is the
      project lead this is a proprietary disposition, confirmed explicitly at
      this gate rather than tacitly inherited. The book still claims no
      rights-holder permission for any source because none was sought. The
      author additionally directed the latest possible snapshot, and this gate
      verified rather than assumed it: the checkout HEAD
      278a127f9170c1aca82035a4a8357b8a995f91d8 dated 2026-07-22 has not moved
      and all three files still reproduce byte for byte. The package stays
      promoted false with lane bundled, because a decision gate promotes
      nothing.
    required_action: >-
      P3-DIGIKAT must repair three defects this gate verified and none of which
      was previously recorded, before any promotion. It must correct the
      godina_potpuna flag, which reads da for 2024 although February through May
      are absent entirely and January is partial. It must record the divergence
      between the annual and monthly files with its exact largest per-cell
      deviation and its proven zero corpus-wide sum, or else drop the monthly
      file. It must add the method-break flag the approved disposition requires,
      covering both the volume change from June 2024 and the platform-coverage
      change as TikTok enters in 2023 and Instagram in 2024. It must also record
      that the 3604 sources carry 551712 of 710307 posts. It must write the
      named substitute for official reconciliation into data/katalog.yml and
      data/katalog.schema.json, satisfied only by byte-for-byte reproduction,
      the denominator identity and the recorded divergence together, with a
      negative fixture that fails when the substitute is declared satisfied
      without all three. It must close digikat_akteri as abandoned with a reason
      and a successor pointer rather than delete it, register WB-C04, WB-C05 and
      WB-C06 as consumers, and re-run the builder verification at its own date,
      re-pinning a moved checkout or recording that it did not move without
      rewriting the 2026-07-22 source date of record.
    basis:
      - conversation:G-A3-DIGIKAT-selection-approved-2026-08-10-Luka-Sikic
      - notes/reports/g-a3-digikat-selection-decision-2026-08-10.md
      - notes/reports/vanjski-izvori-croaicon-digikat-2026-08-05.md
      - notes/reports/g-a3-data-rights-determination-2026-08-05.md
      - registry:data/katalog.yml#digikat_mediji-lane-bundled-promoted-false
