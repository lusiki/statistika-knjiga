  H-P3-EXISTING-002:
    source_packet: P3-EXISTING
    created_at: "2026-08-05"
    kind: constraint
    refs:
      - item:R32-CATALOG-paired-views
      - item:R25-CATALOG-public-views
      - handoff:H-P3-CATALOG-002
      - report:notes/reports/p3-existing-2026-08-05.md
    statement: >-
      The paired analysis and aggregate views exist and reconcile exactly, and
      only the task half of R32-CATALOG-paired-views is still open. Each
      generated package now ships one analysis file and one aggregate whose
      every group count, integer total, mean and share the validator recomputes
      from the analysis file and compares without tolerance. The aggregates are
      deliberately shaped for hand and print verification: every share carries
      its own numerator and denominator, and every mean carries its integer
      total, so a reader can check a row with arithmetic rather than trust a
      rounded number. The expected values are fixed and public:
      anketa_mreze splits 90, 84, 66 and 60 of 300, and populacija_medija splits
      15101, 13378, 10827, 5839 and 4855 of 50000.
    required_action: >-
      WB-C04, WC-C09 and WC-C11 must build their print presets from the
      aggregate file rather than from a fresh calculation, and at least one of
      them must carry a task in which the reader reproduces an aggregate row
      from the analysis file. P5-C must generate both public views from
      data/katalog.yml and may then close R32-CATALOG-paired-views together with
      that task. No packet may change an aggregate value without rerunning
      scripts/build-data-snapshots.R and updating the recorded checksums, and no
      packet may round a value in the file to make a print table look tidier;
      the rounded_mean fixture exists precisely to catch that.
