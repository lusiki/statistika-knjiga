    statement: >-
      Author and editor Luka Sikic accepted the drafted finale spine on
      2026-08-05, as drafted and as amended. The finale carries one arc and no
      more: from the whole book to one evidence package another person can check
      without talking to its author. Chapter 18 assembles rather than
      introduces, and is cumulative at whole-book level: its ratified
      prerequisites are all seventeen numbered chapters, so no metadata, prose,
      exercise or advertised route may present the capstone as standalone. That
      settles R04-C18-whole-prerequisites. Under D13 the main guided study stays
      explanatory and simulated, and one bounded empirical transfer repeats the
      same question, design and claim-boundary order on real data and delivers a
      complete evidence package. The seventh communication thread lands here and
      nowhere else: the reader writes their own honest report to the ratified
      standard and then audits an assistant's report on the same analysis by the
      same measure. Chapter 18 carries twelve aspects, twelve terms, seventeen
      prerequisites and twelve exclusions. THE RECOMMENDED DEFAULT WAS AMENDED,
      NOT ACCEPTED AS RECOMMENDED. The default forbids any new method in the
      capstone; the author amended it so Chapter 18 MAY introduce a technique
      the worked case genuinely requires, under three exact limits: never a
      method on the preface's out-of-scope list, meaning time series, factor
      analysis and psychometrics, multilevel models, the mathematics of machine
      learning, or full Bayesian inference; fully explained where it appears and
      self-contained; and with no forward dependency on anything no earlier
      ratified spine was asked to supply. The author's recorded reason for the
      limits is that an unbounded new method would reopen the scope promise the
      preface makes. Because the acceptance test of R17-C18-two-pass requires
      the empirical transfer to introduce no method, and because Chapter 18's
      worked case is its main guided study, the permission lands in the main
      study and the transfer stays method-free; that boundary is spine exclusion
      4 and D13 keeps the main study explanatory as spine exclusion 5. This gate
      did not amend the R17-C18-two-pass acceptance test. R04-C18-definitions is
      settled with one explicit disposition: Chapter 18 carries zero blocks and
      so falls below the ratified one-to-five band, and rises to exactly one,
      paket dokaza, because it is the only object the finale creates rather than
      retrieves; every other Chapter 18 term stays in prose under .pojam.
    required_action: >-
      In P2-SPINE-FINALE, write exactly this accepted spine into
      bookwright_plugin/bookwright/shared/chapter-spine.json for unit
      18-vase-prvo-istrazivanje and set its ratified flag, recording
      prerequisites and exclusions in the schema-valid form established by
      P2-SPINE-PREFACE, and extend scripts/check-chapter-spines.py with the
      exact exclusion markers, required load-bearing terms and
      ratification-order condition tabulated in the decision record. The
      ratification-order condition and the prerequisite list must both name all
      seventeen numbered chapters, so the finale cannot be ratified before any
      earlier unit and its whole-book cumulativeness is machine-checked. The two
      amended new-method limits must be written as exclusions 2 and 3 and given
      the literal markers "popisa izvan opsega iz predgovora" and "u cijelosti
      objasnjena ondje gdje se pojavljuje", so removing either fails the
      deterministic check; P2-SPINE-FINALE and P6-CONTINUITY are the two named
      enforcers of the amended boundary, P2-SPINE-FINALE by making it
      machine-checkable before any finale prose exists and P6-CONTINUITY by
      auditing the finished book against it and reporting any technique that
      entered the capstone without a self-contained explanation at its point of
      appearance or with a dependency no earlier ratified spine supplies. Change
      no chapter prose, no chapter stage and no terminology, add or remove no
      #def- block, and ratify no other spine. Record the approved one-block
      Chapter 18 definition increase as a forward constraint to P2-TERMS and
      WE-C18 rather than implementing it, because H-P1C-INTEGRITY-002 freezes
      the live definitions until P2-TERMS retires that debt, exactly as
      H-P2-SPINE-V-001 did for Chapter 17. Record as a forward constraint that
      the existing Chapter 18 .chapter-meta row names a narrower prerequisite
      than the ratified spine and must be reconciled by WE-C18, and that
      P5-ROUTES may publish no route that enters Chapter 18 without the whole
      book. Do not amend the acceptance test of R17-C18-two-pass, claim no
      rights-holder permission for any source, and make no independent-review
      claim.
