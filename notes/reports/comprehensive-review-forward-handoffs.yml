    statement: >-
      Three rejected-scope items were deliberately NOT closed by P2-DOCS and all
      three stay at status ratified for the same reason. Their acceptance tests
      each require that the book keep limits explicit and that it ROUTE the
      reader when no method in the book fits, and routing lives in
      dodaci/d-koji-test.qmd. That appendix is 47 lines, marks itself a partial
      draft against a planned 1500 words, carries one starting-procedure table
      and a short post-selection paragraph, and states no rule at all about
      dependent, clustered, repeated or network-linked observations and no route
      out of the book. The other halves are already satisfied and were verified
      at this source state: Chapter 8's tasks derive no formula and its prose
      carries design effects and effective sample size, and Chapter 16 fits no
      logistic model and introduces no causal estimator. Closing the items here
      would have asserted a routing capability the book does not have.
    required_action: >-
      P5-D must complete Appendix D as the decision and recovery aid, including
      the explicit route for repeated, clustered, longitudinal and network-linked
      observations and the statement that no method in this book is adequate for
      them, and must keep the limits of every listed procedure explicit. Only
      then may R12-SCOPE-no-variance-course, R14-SCOPE-reading-not-fitting and
      R23-SCOPE-reading-not-production close, and each must be closed against its
      own test rather than by aggregation. WC-C08 must keep the design-effect and
      effective-sample-size limits explicit in Chapter 8 and must add no task
      that derives a variance formula. WD-C16 must keep Chapter 16 to
      recognition, interpretation, limitation and routing, so its ratified
      bounded bridge to binary outcomes, odds ratios and predicted probabilities
      is read rather than fitted.
    basis:
      - source:dodaci/d-koji-test.qmd-47-lines-partial-draft-no-dependence-route
