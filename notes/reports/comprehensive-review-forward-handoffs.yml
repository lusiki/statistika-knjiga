        disposition: >-
          G-A3-DIGIKAT honoured the catalogue promotion contract by promoting
          nothing and by editing no catalogue entry at all. digikat_mediji stays
          promoted false with lane bundled, promoted_total stays 3, and
          determ_korpus and digikat_akteri are untouched. Resolved rights were
