  H-G-A3-DIGIKAT-001:
    source_packet: G-A3-DIGIKAT
    created_at: "2026-08-10"
    kind: decision
    refs:
      - decision:G-A3-DIGIKAT
      - item:R03-DIGIKAT-rights
      - item:R08-DIGIKAT-package
