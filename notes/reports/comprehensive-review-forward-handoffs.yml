          - "spine:sha256-de298deedf4b34b80bde1d39c048479b61e3f7b02b95eb9461e22dbb205fbd52"
          - "registry:bookwright_plugin/bookwright/shared/chapter-spine.json#17-doba-algoritama.prerequisites-02-03-08-10-11-13-16"
          - "registry:bookwright_plugin/bookwright/shared/chapter-spine.json#17-doba-algoritama.exclusions-1-bez-poglavlja-13"
