      the reviewer route as recommended on 2026-08-05. Terminology review is
      wholly the author's own editorial responsibility and the first edition may
      make no independent-review claim about its terminology anywhere. The 166
      distinct Croatian forms carried by the nineteen ratified spines across 168
      key-term slots are confirmed canonical and none is reopened. Fifteen
      load-bearing forms the spines named without canonising are fixed:
      razdvajanje na skup za ucenje, provjeru i ispitivanje with its three
      component sets, procjenjivana velicina, curenje informacija, zabiljezeni
      referentni ishod, klasifikacijski prag, paket dokaza, putovnica skupa
      podataka, objava uporabe asistenta, analiticka fleksibilnost,
      reproducibilnost, jedinica analize, Simpsonov paradoks, temeljna stopa,
      and varijanca beside standardna devijacija as one merged block naming
      both. R36-BOOK-new-cluster is settled across the four activities, the
      split vocabulary, izgledi with omjer izgleda and predvidjena vjerojatnost,
      the causal terms, osjetljivost with provjera osjetljivosti, kalibrirana
      nesigurnost with kalibracija stope pogreske prve vrste, and pomak
      distribucije. Four meaning collisions carry rules: osjetljivost never
      names the confusion-table rate, kalibracija is never standalone,
      predvidjanje is the canonical noun with predikcija surviving only inside
      sustav predikcije, and neither referentna oznaka nor zabiljezeni
      referentni ishod is ever written as istina or ground truth. Three
      deliberate departures carry reasons: tablica zabune rather than matrix,
      kolider, and izgledi. Three #def- identifiers deliberately do not follow
      their bolded term and must never be renamed, because they anchor the
      concept-graph node and the pojmovnik link:
      def-standardizirani-rezidual whose canonical term is prilagodjeni
      standardizirani rezidual, def-korelacija whose canonical term is
      Pearsonova korelacija beside the general key term korelacija, and
      def-mala-polja. The six ratified definition maps take the frozen set from
      46 to 52; this gate wrote no block and the live count remains 46.
    required_action: >-
      P2-TERMS must implement exactly this register: reconcile the live
      definitions and the canonical concept ledger against the six approved
      maps and these canonical forms, replace the stale concept-ledger entry
      standardizirani rezidual and its Pearson-form definition with the
      canonical prilagodjeni standardizirani rezidual while leaving the
      def-standardizirani-rezidual identifier untouched, regenerate
