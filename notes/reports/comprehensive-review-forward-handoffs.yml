          P3-EXISTING consumed this delivery before the packet claim and before
          the first substantive edit, and it settles the clause this handoff
          addresses to it by name. **UCBAdmissions and anscombe stay
          external-only.** The packet looked for authoritative dataset-specific
          redistribution evidence rather than assuming its absence: the locally
          installed datasets package at R 4.6.0 states only
          "License: Part of R 4.6.0", which is a package-level marker and not a
          dataset-specific redistribution notice, and neither entry in
          tools::Rd_db("datasets") carries licence or redistribution terms.
