    statement: >-
      Author, release owner, archive owner, and errata owner Luka Sikic
      approved the recommended G-A1d mechanism and accepted all three owner
      responsibilities on 2026-08-03. Phase 1 may create and demonstrate the
      edition/version, Croatian changelog, citation, provenance, archive-plan,
      term-freeze, and errata mechanisms locally. D14 retains Osnove
      statistike za društvene znanosti as the working title unless the author
      changes it before citation metadata freeze. No push, merge, tag,
      archival deposit, deployment, publication, or other external action is
      authorised.
