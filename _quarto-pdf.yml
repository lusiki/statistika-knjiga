# PDF profil.
# Pokreni preko: powershell -File scripts/render-book-pdf.ps1
#   (NE golim `quarto render --profile pdf` — vidi zaglavlje te skripte)
# Izlaz: pdf/Statistika.pdf
#
# Ova datoteka nadjačava _quarto.yml. Sve što ovdje nije navedeno nasljeđuje
# se iz zadane konfiguracije, pa HTML build ostaje netaknut.
#
# DODACI: PDF nosi samo literaturu (references.qmd) i dodatke A–F, dok web
# zadržava i samostalne stranice (pojmovnik, interakcije, podaci, resursi,
# uči-uz-AI, predavanja, silabus, raspored). To se NE može riješiti odavde —
# Quarto spaja `book.appendices` polja aditivno, pa kraći popis ovdje samo
# produljuje onaj iz _quarto.yml. Umjesto toga scripts/render-book-pdf.ps1
# privremeno prepiše blok dodataka u _quarto.yml i vrati ga nakon rendera.

project:
  output-dir: pdf

book:
  title: "Osnove statistike za društvene znanosti"
  subtitle: "Udžbenik za studente koji moraju razumjeti istraživanje"
  output-file: "Statistika"

format:
  pdf:
    documentclass: scrbook
    classoption:
      - headings=standardclasses
      - twoside
      - open=right
      - numbers=noenddot
    pdf-engine: xelatex
    # Format bloka: B5 (176 × 250 mm). Satnica je uska da stupac teksta
    # ostane na 66 znakova, a vanjski rub širok da primi bilješke i izvore
    # (DESIGN.md, §7 „Mreža").
    papersize: b5
    geometry:
      - paperwidth=176mm
      - paperheight=250mm
      - inner=22mm
      - outer=38mm
      - top=22mm
      - bottom=25mm
      - marginparwidth=28mm
      - marginparsep=5mm
    fontsize: 10.5pt
    linestretch: 1.18
    lang: hr-HR
    toc: true
    toc-depth: 2
    toc-title: "Sadržaj"
    number-sections: false
    # Poveznice u tinti, nikad plave — boju postavlja tex/theme.tex.
    colorlinks: false
    fig-pos: "H"
    # Blok je crno-bijel, pa i ispis koda ide u sivim tonovima.
    highlight-style: styles/statistika-tisak.theme
    # Boje, pisma i naslovnica dolaze iz tiskarskog sloja teme.
    include-in-header:
      - tex/theme.tex
    include-after-body:
      - tex/colophon.tex

# Statički blizanci interaktivnih grafova koriste Unicode znakove u
# oznakama (Δ, →, ₙ, ≥). Zadani Windows uređaj ih ispušta; cairo_pdf ih
# ispisuje ispravno. Pozadina je prozirna da se boja papira definira samo
# na jednom mjestu (\pagecolor u tex/theme.tex).
#
# Širina je usklađena sa satnicom B5 bloka; grafovi se ne skaliraju u
# stranici nego se crtaju u konačnoj veličini, pa oznake osi zadrže zadanih
# 8,2 pt i ostanu čitljive.
knitr:
  opts_chunk:
    dev: "cairo_pdf"
    fig.width: 4.7
    fig.height: 3.0
    dev.args:
      cairo_pdf:
        bg: "transparent"

filters:
  - pdf-filters/strip-ojs.lua
  # Infografike u SVG-u prethodno se rasteriziraju (scripts/svg-to-png.R),
  # a ovaj filter prepisuje .svg u .png samo za PDF build.
  - pdf-filters/swap-svg-png.lua
  # Pedagoške kutije (.callout-vinjeta/divljina/model/greska) omataju se u
  # tcolorbox okruženja definirana u tex/theme.tex; bez ovoga bi u PDF-u
  # ispale kao obični pasusi.
  - pdf-filters/book-callouts.lua
