      - "chapters/05-vizualizacija.qmd"
      - "chapters/06-povezanost.qmd"
      - "chapters/18-vase-prvo-istrazivanje.qmd"
      - "dodaci/a-praktikum.qmd"
      - "dodaci/c-katalog-podataka.qmd"
      - "podaci.qmd"
    source: "R/podaci-nastavni.R, funkcija simuliraj_anketu"
    version: "300 opazanja, sjeme 4001; inacica je deklarirano stanje izvora P1B-DATA-LIC"
    licence: "CC BY 4.0"
    licence_uri: "https://creativecommons.org/licenses/by/4.0/legalcode"
    attribution: >-
      Luka Sikic; Osnove statistike za drustvene znanosti; ime skupa; generator;
      poveznica na licencu; oznaka izmjena.
    access: "Lokalno generiranje bez mreze."
    redistribution: "provjerena"
    lane: "bundled"
    refresh_class: "generated"
    fallback: >-
      Generator vec pokriva R i renderirane zadatke; buduca CC BY 4.0 snimka
      pokriva jamovi put i preuzimanje.
    generated_data_notice: "data/LICENCA-generirani-podaci.md"
    build_script: "R/podaci-nastavni.R"
    integrity:
      checksum: "b988c25a8017e2d4dcd26be160890e89"
      checksum_algorithm: "md5"
      official_reconciliation: >-
        Sluzbeni izvor ovoga skupa je njegov generator, pa je usklađenje
        usporedba s njim, a ne s vanjskom tablicom. Snimka
        data/anketa-mreze.csv jednaka je bajt po bajt serijalizaciji izlaza
        funkcije simuliraj_anketu(n = 300, sjeme = 4001) iz R/podaci-nastavni.R
        pod R 4.6.0, sto provjerava scripts/build-data-snapshots.R bez
        argumenta --write. Agregat data/anketa-mreze-agregat.csv ponovno se
        izracunava iz analiticke snimke i poklapa se tocno u sve cetiri skupine
        i u svakom stupcu: 90 + 84 + 66 + 60 = 300 ispitanika, zbroj minuta
        7339 + 4567 + 2139 + 974 = 15019 i zbroj povjerenja
        574 + 467 + 323 + 270 = 1634.
      note: >-
        Snimka postoji i nosi kontrolni zbroj. Reproducira se iz deklariranoga
        sjemena, a to provjeravaju scripts/build-data-snapshots.R i
        scripts/check-data-integrity.R.
    promoted: true
    promoted_by: "P3-EXISTING"
    promoting_gate: "P3-EXISTING"
    files:
      - "data/anketa-mreze.csv"
      - "data/anketa-mreze-agregat.csv"
    aggregate_view: "data/anketa-mreze-agregat.csv"
    snapshot_notice: "data/anketa-mreze.LICENCA.md"
    storage:
      encoding: "UTF-8"
      line_ending: "LF"
      filenames_ascii: true
      weights: null
      weights_note: >-
        Nacrt je jednostavan slucajan izvlak iz generirane populacije bez
        nejednakih vjerojatnosti odabira, pa tezine uzorkovanja ne postoje i
        prazan stupac tezina ne smije se izmisliti. Poglavlje 8 tezine uci na
        skupu koji ih ima kao pojam, ne na ovoj snimci.
      precision_note: >-
        Analiticka snimka drzi cjelobrojne vrijednosti onako kako ih generator
        proizvodi. Agregat drzi puni zbroj uz svaki prosjek i puni brojnik i
        nazivnik uz svaki udio, a prosjeci su zapisani najkracim povratnim
        zapisom. U datoteci nema zaokruzivanja; ono postoji samo u prikazu.
      missing_note: >-
        Nedostajucih vrijednosti nema i nijedna celija nije prazna, pa nijedan
        stupac ne nosi sifru nedostajuce vrijednosti. Da se pojavi, dobila bi
        vlastitu sifru i ostala razlicita od nule, od potisnute i od
        neobjavljene vrijednosti.
    file_records:
      - path: "data/anketa-mreze.csv"
        role: "analysis"
        md5: "b988c25a8017e2d4dcd26be160890e89"
        rows: 300
        row_band: [300, 300]
        key: "ispitanik"
        columns:
          - name: "ispitanik"
            type: "text"
            unit: "identifikator"
            missing_code: null
            pattern: "^I[0-9]{3}$"
            description: "Kljuc ispitanika, stabilan kroz sve rendere."
          - name: "dob"
            type: "integer"
            unit: "godina"
            missing_code: null
            min: 18
            max: 70
            description: "Navrsene godine ispitanika."
          - name: "dobna_skupina_sifra"
            type: "code"
            unit: "sifra razine"
            missing_code: null
            pairs_with: "dobna_skupina"
            levels:
