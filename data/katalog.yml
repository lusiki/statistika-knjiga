        Kriva tvrdnja o koncentraciji pada na javnu raspravu o trosenju
        proracuna i na imenovane primatelje u uzvodnom registru.
      appeal: "Ispravak upisa vodi se kod nadleznoga tijela, izvan opsega knjige."
