          - name: "minute_dnevno"
            type: "integer"
            unit: "minuta na dan"
            missing_code: null
            min: 1
            max: 1440
            description: "Dnevno vrijeme na mrezama; raspodjela je desno asimetricna."
          - name: "povjerenje"
            type: "integer"
            unit: "bod na ljestvici 1 do 10"
            missing_code: null
            min: 1
            max: 10
            description: "Povjerenje u sadrzaj na ljestvici od 1 do 10."
      - path: "data/anketa-mreze-agregat.csv"
