promotion_contract:
  availability_is_not_promotion: true
  technical_access_is_not_redistribution_authority: true
  promotable_lanes:
    - "bundled"
  required_before_promotion:
    - "traka je bundled"
    - "redistribucija je provjerena"
    - "zabiljezen je kontrolni zbroj"
    - "zabiljezeno je uskladjenje sa sluzbenim izvorom ili zadovoljena imenovana trodijelna zamjena za nesluzbeni izvor"
    - "naveden je barem jedan datotecni put"
    - "zabiljezena je zakonita zamjena za svaki obvezni studentski put"
    - "paketni gate imenovan u promoting_gate je prihvacen"
    - "promoting_gate imenuje paket koji doista dohvaca, nikada odlucivacki gate"
    - "promotion_log imenuje tocno koje je pakete taj paket promovirao"
    - "snapshot_notice nosi izravnu poveznicu na licencu bas toga paketa"
  promoted_total: 5
  promotion_log:
    - packet: "P3-CATALOG"
      promoted: 0
      recorded_at: "2026-08-05"
      record: "notes/reports/p3-catalog-2026-08-05.md"
      packages: []
    - packet: "P3-EXISTING"
      promoted: 2
      recorded_at: "2026-08-05"
      record: "notes/reports/p3-existing-2026-08-05.md"
      packages:
        - "anketa_mreze"
        - "populacija_medija"
    - packet: "P3-DZS"
      promoted: 1
      recorded_at: "2026-08-05"
      record: "notes/reports/p3-dzs-2026-08-05.md"
      packages:
        - "dzs_turizam"
    - packet: "P3-DIGIKAT"
      promoted: 1
      recorded_at: "2026-08-10"
      record: "notes/reports/p3-digikat-2026-08-10.md"
      packages:
        - "digikat_mediji"
    - packet: "P3-EUROSTAT"
      promoted: 1
      recorded_at: "2026-08-10"
      record: "notes/reports/p3-eurostat-2026-08-10.md"
      packages:
        - "eurostat_drustvo"
  note: >-
    P3-CATALOG je stvorio ugovor i registrirao inventar bez ijedne promocije.
    P3-EXISTING promovira tocno dva generirana paketa, i to jedina dva za koja
    postoji vlasnicka dispozicija o redistribuciji. P3-DZS promovira tocno jedan
    vanjski paket, prvi u knjizi koji ne dolazi iz vlastitoga generatora. Svaka
    promocija mora stajati u promotion_log, zbroj upisa mora biti jednak polju
    promoted_total, a ono stvarnom broju zapisa s promoted true; paket smije biti
    promoviran samo pod gateom koji sam imenuje u promoting_gate i koji je upisan
    u promoted_by. P3-DZS je ugovor pooostrio na tri mjesta koja je prvi vanjski
    paket otkrio kao praznine. Odlucivacki gate vise ne smije stajati u
    promoting_gate, jer gate koji nista ne dohvaca ne moze ni provjeriti sto
    promice; kad se promoting_gate premjesti, mora se imenovati odluka koja je to
    ratificirala, pa se paket ne moze sam sebi dodijeliti. Promotion_log vise ne
    nosi samo broj nego i imena promoviranih paketa, jer se promocija u broju
    moze sakriti, a u imenu ne. I obavijest uz snimku provjerava se prema licenci
    bas toga paketa, a ne prema pretpostavci da je svaki paket CC BY 4.0.
    Dostupnost i dalje ne promice nista. P3-DIGIKAT dodaje usku zamjenu za
    sluzbeno uskladjenje kada nesluzbeni izvor nema sluzbeni ukupni broj:
    reprodukcija bajt po bajt, identitet nazivnika bez tolerancije i otvoreno
    zabiljezena divergencija moraju proci zajedno. Nijedan od ta tri testa ne
    moze se zamijeniti opisom.
    P3-EUROSTAT prvi put veze promovirani paket uz jedan odobreni sluzbeni
    mrezni batch izvan rendera: sest tocnih upita, sest neizmijenjenih odgovora,
    datum i checksum svakoga odgovora te 162 uskladjenja moraju ostati zajedno.

