  - "Puna brojcana preciznost cuva se u datoteci; zaokruzivanje postoji samo u prikazu."
  - "Postotak zadrzava brojnik i nazivnik."
  - "Anketna datoteka zadrzava tezine uzorkovanja."
  - "Nula, nedostajuca, potisnuta i neobjavljena vrijednost ostaju razlicite."

