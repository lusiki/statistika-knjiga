  note: >-
    P3-CATALOG stvara ugovor i registrira inventar. Ne promovira nijedan paket.
    Promociju izvodi imenovani kasniji gate, uz vlastiti dokaz o izvoru,
    inacici, licenci, obavijesti i kontrolnom zbroju.

