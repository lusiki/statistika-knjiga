# Kanonski katalog podataka --------------------------------------------------
# Jedini strojno citljiv zapis o podacima knjige. Nastao u paketu P3-CATALOG iz
# inventara P1B-DATA-LIC. Provjerava ga scripts/check-katalog.py protiv
# data/katalog.schema.json i on pada zatvoreno.
#
# Traka je sadasnji pravni i uredjivacki status, a ne obecanje promocije.
# Dostupnost nije promocija. Tehnicki pristup nije ovlast za redistribuciju.
# ---------------------------------------------------------------------------
schema_version: 1
catalogue: "data-katalog"
decision: "P3-CATALOG"
ratified_at: "2026-08-05"
source_inventory: "notes/reports/p1b-data-licence-access-inventory-2026-08-03.md"
implementation_record: "notes/reports/p3-catalog-2026-08-05.md"
sole_machine_readable_record: true

rights_boundary:
  rights_holder_permission_obtained: false
  rights_holder_permission_claim_permitted: false
  determination_record: "notes/reports/g-a3-data-rights-determination-2026-08-05.md"
  note: >-
    Knjiga ne smije nigdje tvrditi da je pribavila dopustenje nositelja prava,
    jer ono nije trazeno. Smije navesti svaki izvor i njegove objavljene uvjete.
    Autorova odredba od 5. kolovoza 2026. veze G-A3-DZS, P3-DZS, G-A3-DIP,
    P3-DIP, P3-CATALOG i P8-META. H-P1B-DATA-LIC-003 nije nadomjesten i ostaje
    obveza G-A3 paketnih gateova.

lanes:
  bundled:
    permitted: >-
      Tocna datoteka ili reproducibilni izlaz smije se spremiti i dijeliti uz
      zabiljezenu inacicu, atribuciju, licencu, obradu i kontrolu integriteta.
    forbidden_assumption: >-
      Sama javna adresa ili mogucnost preuzimanja nije dovoljna.
  portal-mediated:
    permitted: >-
      Knjiga daje sluzbenu poveznicu, tocnu uputu, inacicu i kontrolni trag, a
      citatelj preuzima od pruzatelja.
    forbidden_assumption: >-
      Portalni pristup ne prikazuje se kao lokalna datoteka niti kao paritet
      svih izdanja.
  external-only:
    permitted: >-
      Izvor se moze navesti kao vanjski slucaj ili neobvezna mogucnost ako su i
      takva uporaba i citiranje zakoniti.
    forbidden_assumption: >-
      Datoteka, redci ili izvedeni skup ne ulaze u repozitorij bez nove
      mjerodavne provjere.

refresh_classes:
  - "generated"
  - "frozen"
