      - "Redci sa statusom Upozorenje iskljuceni su; najveci medju njima iznosi oko 18,7 milijardi eura."
      - "Naslovni iznos izvjesca za 2024. nije izravno usporediv s ranijim izvjescima."
      - "Velicina se odnosi na pojedinu dodjelu i moze se mijenjati kroz vrijeme."
      - >-
        Upravljanje: vrata G-A3-RDP imenovana su u polju promoting_gate, ali JOS
        NISU upisana u notes/reports/comprehensive-review-implementation-register.yml.
        Ratificirani program nikada nije predvidio CroAIcon kao izvor; predvidio
        je samo gfi_fina, i to je zabranio. Uvodjenje tih vrata mijenja registar
        i trazi autorsko odobrenje na zatvaranju paketa. Dok ih nema, paket se
        ne moze promovirati ni pod kojim postojecim gateom.

  - id: "bdp_dugi_niz"
    name: "BDP po stanovniku, dugi niz i pet procjena"
    status: "registered_not_promoted"
    design: "official_aggregate_statistics"
    domain: "ekonomska povijest i usporedivost mjerenja"
    unit: >-
      Jedna godina. U datoteci izvora to je godina s pet odvojenih procjena, u
      spojenoj datoteci godina jednoga ulancanog niza, a u datoteci razdoblja
      jedno imenovano razdoblje.
    question: "Koliko se razlikuju objavljene procjene iste velicine i sto se dobiva kad ih se spoji u jedan niz?"
    role: "Pet objavljenih procjena iste velicine, s razlicitim jedinicama i sa spojenim nizom."
    consumers: []
    source: >-
      Pet objavljenih procjena BDP-a po stanovniku za Hrvatsku: Eurostat
      nacionalni racuni nama_10_pc; Maddison Project Database 2023 (Bolt i van
      Zanden, 2024.); Penn World Table 10.01; Svjetska banka WDI
      NY.GDP.PCAP.KD; Tica, J. (2004.), Zagreb International Review of Economics
      and Business 7(1):103-133. Spajanje i ulancavanje izveo je projekt
      AI.econ / CroAIcon; registar izvora je data/reference/gdp_sources.json u
      tom projektu.
    version: >-
      Sastav projekta AI.econ od 22. lipnja 2026. Raspon 1870.-2025.; cetiri
      tocke prije 1910. su pojedinacne referentne procjene, ne godisnji niz.
    licence: "CC BY 4.0 za sastav i spojeni niz; pet komponenti nosi vlastite uvjete"
    licence_uri: "https://creativecommons.org/licenses/by/4.0/legalcode"
    attribution: >-
      Svaki stupac nosi vlastiti izvor i vlastiti citat; puna matrica pet izvora,
      pet jedinica i pet licenci stoji u data/bdp-hrvatska.LICENCA.md. Maddison
      se citira kao Bolt i van Zanden (2024.), Tica kao Tica (2004.).
    access: "Sluzbena sucelja pet pruzatelja; Ticina rekonstrukcija samo kao PDF na Hrcaku"
    redistribution: >-
      nije dovrsena. Suglasnost suautora projekta AI.econ autor je potvrdio
      5. kolovoza 2026. Preostaju dvije zapreke: Eurostatov stupac po ovom
      katalogu pripada traci portal-mediated, u kojoj se datoteka ne pohranjuje
      nego se daje uputa za preuzimanje, i uvjeti MPD-a za prikaz jedne zemlje
      nisu potvrdjeni.
    lane: "bundled"
    refresh_class: "manual-derived"
    fallback: >-
      Do promocije obvezni studentski put koristi paket dzs_turizam ili
      generirani paket; ovaj paket sluzi za pripremu i za prikaz.
    provenance:
      retrieved_at: "2026-08-05"
      route: >-
        Autorov lokalni checkout projekta CroAIcon. Citane su vec izracunate
        tablice pod outputs/tables/; nijedan uzvodni pruzatelj nije kontaktiran
        iz ovoga repozitorija. Ovaj paket nije obavio nijedno mrezno preuzimanje.
      chain:
        - "projekt:data/reference/gdp_sources.json (registar pet izvora, uloga i licenci)"
        - "projekt:R i python skripte koje su niz sastavile i ulancale"
        - "projekt:outputs/tables/gdp_raw.csv, gdp_long.csv, gdp_growth_eras.csv"
        - "projekt:outputs/facts/gdp_provenance.json (baza indeksa, odsjecci, oznaceni prekid)"
        - "repozitorij:scripts/build-croaicon-extracts.py (izvadak u data/)"
      source_last_modified: "2026-06-22"
      source_last_modified_note: >-
        Datum je vrijeme kad je uzvodni projekt sastavio niz, zabiljezeno u
        njegovoj datoteci provenijencije. Pet uzvodnih pruzatelja ima pet
        vlastitih datuma objave i oni ovdje nisu spojeni u jedan.
      transformations:
        - "Imena stupaca prevedena na hrvatski; jedinica je upisana u ime stupca, jer se stupci razlikuju upravo po jedinici."
        - "Uzvodni NA zapisan je kao '..' i znaci da imenovana procjena ne pokriva tu godinu."
        - "Razmaci u oznakama razdoblja zamijenjeni podvlakom."
        - "Logicke vrijednosti TRUE i FALSE zapisane su kao da i ne."
        - "Izostavljena Chow-Lin mjesecna razdioba za 1991.-1992., jer je modelirana velicina, a ne opazanje."
        - "Kodiranje UTF-8 bez BOM-a, zavrsetak retka LF."
    missing_value_codes:
      - code: ".."
        meaning: "imenovana procjena ne pokriva tu godinu"
        occurs_in_extract: true
        note: >-
          Pojavljuje se u svih pet stupaca datoteke bdp-hrvatska-izvori.csv i
          nikada ne znaci nulu. Razlozi su razliciti po stupcu: Maddison za
