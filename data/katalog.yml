  technical_access_is_not_redistribution_authority: true
  promotable_lanes:
    - "bundled"
  required_before_promotion:
    - "traka je bundled"
    - "redistribucija je provjerena"
    - "zabiljezen je kontrolni zbroj"
    - "zabiljezeno je usklađenje sa sluzbenim izvorom"
    - "naveden je barem jedan datotecni put"
    - "zabiljezena je zakonita zamjena za svaki obvezni studentski put"
    - "paketni gate imenovan u promoting_gate je prihvacen"
