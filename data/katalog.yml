      - "Jedinica je DOLAZAK, ne osoba. Od 2017. izvor je eVisitor, a gost koji promijeni smjestaj prijavljuje se ponovno i broji se opet. Vrijednost za 2025. znaci 20698963 dolaska, ne 20,7 milijuna ljudi. Nocenja su stabilnija mjera obujma."
      - "REPUBLIKA HRVATSKA i zupanije stoje u istom stupcu objavljene tablice bez oznake razine; zbrajanje toga stupca dvostruko broji cijelu drzavu."
      - "Rezidentnost je u BS_TU11 pisana malim, a u BS_TU12 velikim pocetnim slovom; spajanje dviju tablica po tome stupcu trazi da se to primijeti."
      - "Anketna tablica je procjena iz uzorka, a mjesecna i zupanijska su administrativno prebrojavanje; njihove se brojke ne smiju zbrajati ni usporedjivati kao da mjere istu velicinu."
      - "U anketnoj tablici dijelovi ne daju tocno zbroj, s najvecim ostatkom 1, jer je svaka celija zasebno zaokruzena procjena."
      - "Datum posljednje izmjene izvora nije zabiljezen jer ga zrcalo nije preuzelo; zabiljezeni su datum preuzimanja i posljednje objavljeno opazanje."

