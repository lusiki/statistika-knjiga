  note: >-
    P3-CATALOG je stvorio ugovor i registrirao inventar bez ijedne promocije.
    P3-EXISTING promovira tocno dva generirana paketa, i to jedina dva za koja
    postoji vlasnicka dispozicija o redistribuciji. Svaka promocija mora stajati
    u promotion_log, zbroj upisa mora biti jednak polju promoted_total, a ono
    stvarnom broju zapisa s promoted true; paket smije biti promoviran samo pod
    gateom koji sam imenuje u promoting_gate i koji je upisan u promoted_by.
    Dostupnost i dalje ne promice nista.

