        Dodjele koje u registar nisu upisane ne postoje u ovim brojkama.
        Tablica obuhvata je jedini nacin da se ta odsutnost uopce vidi.
      identifiability: >-
        Agregat; nijedan primatelj nije imenovan i nijedan OIB se ne pojavljuje.
        Uzvodni registar JEST imenovan i javan, sto je razlog vise da izvadak
        ostane na razini skupine.
      beneficiaries: "Citatelj koji uci razlikovati okvir zapisa od pojave koju zapis mjeri."
