# Kanonski katalog podataka --------------------------------------------------
# Jedini strojno citljiv zapis o podacima knjige. Nastao u paketu P3-CATALOG iz
# inventara P1B-DATA-LIC. Provjerava ga scripts/check-katalog.py protiv
# data/katalog.schema.json i on pada zatvoreno.
#
# Traka je sadasnji pravni i uredjivacki status, a ne obecanje promocije.
# Dostupnost nije promocija. Tehnicki pristup nije ovlast za redistribuciju.
# ---------------------------------------------------------------------------
