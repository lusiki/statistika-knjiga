project:
  type: book
  output-dir: docs
  execute-dir: project
  # AI-konzumabilni izvoz (notes/ai-export-spec.md). Generira docs/ai/*.md,
  # docs/llms.txt, docs/llms-full.txt i data/ai-exports.json prije rendera.
  # Skripta je obavijena tryCatch-om pa nikad ne ruši build.
  pre-render:
    - R/build-ai-exports.R
  # GitHub Pages mora moći prikazati 404 s bilo koje dubine URL-a, a ista se
  # datoteka mora moći pregledati i iz lokalnog korijena. Ugradnja lokalnih
  # resursa nakon rendera uklanja ovisnost o produkcijskom podputu.
  post-render:
    - python scripts/embed-404-assets.py
  resources:
    - robots.txt
    # Predavanja (reveal.js) renderiraju se zasebno u predavanja/ i ovdje se
    # kopiraju u docs/predavanja/. Dodaj svaki novi .html deck u ovaj popis.
    # - predavanja/01-zasto-statistika.html

book:
  title: "Osnove statistike za društvene znanosti"
  subtitle: "Udžbenik za studente koji moraju razumjeti istraživanje"
  author:
    - name: "Luka Šikić"
    - name: "Petra Palić"
  date: last-modified
  date-format: "D MMMM YYYY"

  description: "Udžbenik statistike za društvene znanosti — statističko mišljenje, opisivanje podataka, uzorkovanje i procjena, zaključivanje, linearni modeli i statistika u doba algoritama."

  # Vizualni identitet još nije odabran (vidi DESIGN.md). Otključaj kad
  # naslovnica i favicon postoje kao datoteke:
  # cover-image: cover.png
  # favicon: images/favicon.ico

  site-url: "https://lusiki.github.io/statistika-knjiga/"
  repo-url: "https://github.com/lusiki/statistika-knjiga"
  repo-branch: main

  navbar:
    pinned: true
    left:
      - text: "Knjiga"
        href: chapters/00-predgovor.qmd
      - text: "Interakcije"
        href: interakcije.html
      - text: "Praktikum"
        href: dodaci/a-praktikum.html
      - text: "Pojmovnik"
        href: pojmovnik.html
      - text: "Podaci"
        href: podaci.html
      - text: "Uči uz AI"
        href: uci-s-ai.html
      - text: "Nastava"
        menu:
          - text: "Predavanja"
            href: predavanja.html
          - text: "Silabus"
            href: silabus.html
          - text: "Tjedni raspored"
            href: raspored.html
      - text: "Resursi"
        href: resursi.html
    right: []

  search:
    location: sidebar
    type: overlay
  page-navigation: true
  reader-mode: true
  sharing: [twitter, facebook, linkedin]

  sidebar:
    style: docked
    # Bez `background:` — Bootstrapov bg-light je hladno sivi i pregazio bi
    # topli papir. Boju sidebara postavlja styles/_components.scss iz tokena.
    collapse-level: 4
    tools:
      - icon: file-earmark-pdf
        href: pdf/Statistika.pdf
        text: "Preuzmi PDF (radna verzija)"

  page-footer:
    center: "© 2026 · Osnove statistike za društvene znanosti"
    # Quarto book zanemaruje `project.render` za datoteke izvan knjige, ali
    # legitimne interne poveznice podnožja dodaje u render-set. Desni je stupac
    # sistemski (CSS ga skriva) i drži hubove izvan numeracije, sidebara i
    # prethodno/sljedeće slijeda.
    right:
      - text: "Interakcije"
        href: interakcije.qmd
      - text: "Pojmovnik"
        href: pojmovnik.qmd
      - text: "Podaci"
        href: podaci.qmd
      - text: "Uči uz AI"
        href: uci-s-ai.qmd
      - text: "Predavanja"
        href: predavanja.qmd
      - text: "Silabus"
        href: silabus.qmd
      - text: "Tjedni raspored"
        href: raspored.qmd
      - text: "Resursi"
        href: resursi.qmd

  chapters:
    - index.qmd
    - chapters/00-predgovor.qmd
    - part: "DIO I: STATISTIČKO MIŠLJENJE"
      chapters:
        - chapters/01-zasto-statistika.qmd
        - chapters/02-mjerenje-i-dizajn.qmd
        - chapters/03-kako-brojke-zavode.qmd
    - part: "DIO II: OPISIVANJE PODATAKA"
      chapters:
        - chapters/04-sazimanje-podataka.qmd
        - chapters/05-vizualizacija.qmd
        - chapters/06-povezanost.qmd
    - part: "DIO III: OD UZORKA DO POPULACIJE"
      chapters:
        - chapters/07-vjerojatnost.qmd
        - chapters/08-uzorkovanje.qmd
        - chapters/09-procjena.qmd
    - part: "DIO IV: ZAKLJUČIVANJE"
      chapters:
        - chapters/10-logika-testiranja.qmd
        - chapters/11-velicina-ucinka-i-snaga.qmd
        - chapters/12-kriza-i-obnova.qmd
    - part: "DIO V: MODELI"
      chapters:
        - chapters/13-kategoricki-podaci.qmd
        - chapters/14-dvije-grupe.qmd
        - chapters/15-vise-grupa.qmd
        - chapters/16-regresija.qmd
        - chapters/17-doba-algoritama.qmd
    - part: "ZAVRŠNICA"
      chapters:
        - chapters/18-vase-prvo-istrazivanje.qmd

  # Namjensko polje drži Literaturu nenumeriranom, poslije svih poglavlja i
  # neposredno prije dodataka.
  references: references.qmd

  appendices:
    - dodaci/a-praktikum.qmd
    - dodaci/b-jamovi.qmd
    - dodaci/c-katalog-podataka.qmd
    - dodaci/d-koji-test.qmd
    - dodaci/e-rjecnik.qmd
    - dodaci/f-ai-protokol.qmd

bibliography: references.bib

# Quarto 1.9 nema ugrađeni hrvatski prijevod sučelja. `lang` određuje jezik
# dokumenta, a `language` prevodi tekst koji sam Quarto umeće u HTML.
lang: hr-HR
language:
  toc-title-document: "Sadržaj"
  toc-title-website: "Na ovoj stranici"
  section-title-appendices: "Dodaci"
  code-summary: "Prikaži kod"
  code-tools-menu-caption: "Kod"
  code-tools-show-all-code: "Prikaži sav kod"
  code-tools-hide-all-code: "Sakrij sav kod"
  code-tools-view-source: "Prikaži izvor"
  code-tools-source-code: "Izvorni kod"
  copy-button-tooltip: "Kopiraj"
  copy-button-tooltip-success: "Kopirano"
  repo-action-links-source: "Prikaži izvor"
  back-to-top: "Povratak na vrh"
  search-no-results-text: "Nema rezultata"
  search-matching-documents-text: "Rezultati pretraživanja"
  search-copy-link-title: "Kopiraj poveznicu na pretraživanje"
  search-hide-matches-text: "Sakrij dodatne rezultate"
  search-more-match-text: "još jedan rezultat u ovom dokumentu"
  search-more-matches-text: "još rezultata u ovom dokumentu"
  search-clear-button-title: "Očisti pretraživanje"
  search-text-placeholder: "Pretraži knjigu"
  search-detached-cancel-button-title: "Odustani"
  search-submit-button-title: "Pretraži"
  search-label: "Pretraži"
  toggle-section: "Prikaži ili sakrij odjeljak"
  toggle-sidebar: "Prikaži ili sakrij sadržaj"
  toggle-dark-mode: "Promijeni temu"
  toggle-reader-mode: "Promijeni način čitanja"
  toggle-navigation: "Prikaži ili sakrij navigaciju"
  crossref-apx-prefix: "Dodatak"

# PRIVREMENO. Dok nijedno poglavlje ne nosi [@kljuc] citat, bibliografija je
# prazna, a prazno LaTeX okruženje CSLReferences ruši PDF render ("perhaps a
# missing \item"). `@*` uvrštava sve unose iz references.bib, pa stranica
# Literatura ima sadržaj i ujedno pokazuje što je u sjemenskoj bibliografiji.
# U knjizi nocite mora stajati OVDJE; u YAML-u datoteke references.qmd Quarto
# ga u book načinu ignorira.
#
# OBRIŠITE ova dva retka čim prvo poglavlje dobije stvarne citate — inače će
# literatura zauvijek prikazivati i radove koje knjiga nigdje ne citira.
nocite: |
  @*

crossref:
  # Ravna (kontinuirana) numeracija — poglavlja su nenumerirana
  # (number-sections: false), pa bi "Slika 7.1" referencirala nevidljiv broj.
  chapters: false
  fig-title: "Slika"
  tbl-title: "Tablica"
  sec-prefix: "Poglavlje"
  fig-prefix: "Slika"
  tbl-prefix: "Tablica"
  thm-title: "Teorem"
  thm-prefix: "Teorem"
  lem-title: "Lema"
  lem-prefix: "Lema"
  cor-title: "Korolar"
  cor-prefix: "Korolar"
  prp-title: "Propozicija"
  prp-prefix: "Propozicija"
  def-title: "Definicija"
  def-prefix: "Definicija"
  exm-title: "Primjer"
  exm-prefix: "Primjer"
  exr-title: "Zadatak"
  exr-prefix: "Zadatak"
  appendix-title: "Dodatak"

format:
  html:
    theme:
      light:
        - cosmo
        - styles/custom.scss
      dark:
        - cosmo
        - styles/custom.scss
        - styles/_dark.scss
    # Quarto inače postavlja korijenski rem na 17 px; knjižni token tijela već
    # nosi povećanje 1,0625. Normalizirani korijen zato daje namjeravanih 17 px
    # jednom, bez prethodnog dvostrukog skaliranja na 18,06 px.
    fontsize: 16px
    css: styles/styles.css
    lightbox: auto
    code-copy: true
    code-fold: true            # kod je presavijen (načelo 4); praktikum ga otvara
    code-summary: "Prikaži kod"
    # Globalni izbornik izvornog koda nije čitateljski alat. Nastavni profil
    # ga ponovno uključuje, dok presavijeni blokovi ostaju dostupni svima.
    code-tools: false
    code-link: true
    code-overflow: scroll
    code-line-numbers: false
    code-block-bg: true
    # Tiho bojanje sintakse u knjižnoj paleti; tiskani blok ima svoju,
    # sivu inačicu (_quarto-pdf.yml).
    highlight-style: styles/statistika.theme
    toc: true
    toc-title: "Sadržaj"
    toc-depth: 3
    toc-expand: 2
    toc-location: right
    number-sections: false
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    fig-responsive: true
    # SVG čuva oštrinu i prozirnu podlogu u HTML-u. PDF/DOCX profili imaju
    # vlastite uređaje i ovim nisu pogođeni.
    fig-format: svg
    fig-align: center
    fig-cap-location: bottom
    # Format grafa prati stupac teksta (680 px), ne širinu prozora.
    fig-width: 6.6
    fig-height: 4.0
    tbl-cap-location: top
    reference-location: margin
    citation-location: margin
    # Definicije nose glavni oblik sustava (2 px oker crta + blaga ispuna),
    # propozicije i dokazi samo crtu. Izgled je u styles/_base.scss.
    theorem-appearance: default
    definition-appearance: default
    proposition-appearance: simple
    proof-appearance: simple
    linestretch: 1.62
    lang: hr-HR
    citations-hover: true
    footnotes-hover: true
    crossrefs-hover: true
    filters:
      # Sažeti autorski zapis hrvatsko-engleskih parova postaje semantički
      # definicijski popis prije nego što Quarto izgradi HTML odjeljke.
      - path: html-filters/terminology-list.lua
        at: pre-quarto
      # Margin citations and their `.page-full` grid classes are generated by
      # Quarto's final layout pass, so this repair runs after finalisation.
      - path: html-filters/systemic-layout.lua
        at: post-finalize
    # Mreža: stupac teksta 680 px, margina 260 px. Mjera od 66 znakova
    # drži se u SCSS-u (--tok-measure); ovo je okvir oko nje.
    grid:
      sidebar-width: 280px
      body-width: 680px
      margin-width: 260px
      gutter-width: 2.2rem
    # Pisma knjige: Newsreader · Literata · Public Sans · JetBrains Mono.
    include-in-header:
      - styles/head.html
    include-after-body:
      - styles/book-include.html
    prefer-html: true

execute:
  # Skriveni setup chunk postavlja temu, paletu, RNG i hrvatski decimalni
  # zapis. Freeze/cache ne prate promjene u tim izvorima i vraćaju nepotpune
  # nuspojave, pa je tijekom izrade sigurnije uvijek izvršiti aktualni izvor.
  freeze: false
  cache: false
  # Kod je skriven po zadanome (H10). Vidljivost je urednička odluka, ne
  # nuspojava: blok se otvara izričitim `echo: true` i samo u razrađenom
  # primjeru. Nastavni profil vraća `echo: true` globalno, pa seminar dobiva i
  # pogonski kod figura i tablica.
  echo: false
  warning: false
  message: false
