  function setupProgressBar() {
    if (document.getElementById("reading-progress")) return;
    var bar = document.createElement("div");
    bar.id = "reading-progress";
    document.body.appendChild(bar);

    var ticking = false;
    function update() {
      var doc = document.documentElement;
      var scrollTop = window.scrollY || doc.scrollTop;
      var max = (doc.scrollHeight - doc.clientHeight) || 1;
      var pct = Math.min(100, Math.max(0, (scrollTop / max) * 100));
      bar.style.width = pct + "%";
      ticking = false;
    }
    window.addEventListener("scroll", function () {
      if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
    }, { passive: true });
    update();
  }

  // -------------------------------------------------------------------
  // 2. Pregled na prijelaz za unutarnje poveznice (#sidra u dokumentu)
  // -------------------------------------------------------------------
  function setupInternalHover() {
    var tip = null, hideTimer = null;

    function ensureTip() {
      if (tip) return tip;
      tip = document.createElement("div");
      tip.className = "internal-hover-preview";
      document.body.appendChild(tip);
      return tip;
    }

    function show(target, text, title) {
      var t = ensureTip();
      t.innerHTML = "";
      if (title) {
        var h = document.createElement("div");
        h.className = "ihp-title";
        h.textContent = title;
        t.appendChild(h);
      }
      var body = document.createElement("div");
      body.textContent = text;
      t.appendChild(body);

      var rect = target.getBoundingClientRect();
      var left = window.scrollX + rect.left;
      var maxLeft = window.scrollX + document.documentElement.clientWidth - 400;
      if (left > maxLeft) left = maxLeft;
      if (left < 8) left = 8;
      t.style.top = (window.scrollY + rect.bottom + 8) + "px";
      t.style.left = left + "px";
      t.classList.add("visible");
    }

    function hide() { if (tip) tip.classList.remove("visible"); }

    document.addEventListener("mouseover", function (e) {
      var a = e.target.closest && e.target.closest("a[href^='#']");
      if (!a) return;
      if (a.classList.contains("citation") || a.classList.contains("footnote-ref")) return;
      if (a.closest(".sidebar, nav, .toc, #TOC, .quarto-secondary-nav")) return;

      var hash = a.getAttribute("href").slice(1);
      if (!hash) return;
      var tgt = document.getElementById(hash);
      if (!tgt) return;

      var titleEl = tgt.querySelector("h1, h2, h3, h4") ||
                    (tgt.tagName.match(/^H[1-6]$/) ? tgt : null);
      var title = titleEl ? titleEl.textContent.trim() : "";
      var ctx = (tgt.textContent || "").trim().replace(/\s+/g, " ");
      if (title) ctx = ctx.replace(title, "").trim();
      ctx = ctx.slice(0, 280) + (ctx.length > 280 ? "…" : "");

      clearTimeout(hideTimer);
      show(a, ctx, title);
    });

    document.addEventListener("mouseout", function (e) {
      var a = e.target.closest && e.target.closest("a[href^='#']");
      if (!a) return;
      hideTimer = setTimeout(hide, 120);
    });

    window.addEventListener("scroll", hide, { passive: true });
  }

  // -------------------------------------------------------------------
  // 3. Dinkus — pasus koji je samo "***" postaje razdjelnik
  // -------------------------------------------------------------------
  function setupDinkus() {
    document.querySelectorAll("main p").forEach(function (p) {
      var t = p.textContent.trim();
      if (t === "***" || t === "* * *" || t === "◆ ◆ ◆") {
        var div = document.createElement("div");
        div.className = "dinkus";
        p.parentNode.replaceChild(div, p);
      }
    });
  }

      if (h.classList.contains("title")) return;
      if (h.querySelector("a.anchorjs-link")) return;
      var link = document.createElement("a");
      link.className = "anchorjs-link";
      link.href = "#" + h.id;
      link.setAttribute("aria-label", "Poveznica na ovaj odjeljak");
      h.appendChild(link);
    });
  }

      document.body.classList.contains("not-found-page") ||
      SAMOSTALNE.some(function (p) { return normalized.endsWith(p); });

    document.body.classList.add("standalone-page");

    var sb = document.getElementById("quarto-sidebar");

    var msb = document.getElementById("quarto-margin-sidebar");

    document.querySelectorAll(".quarto-page-breadcrumbs").forEach(function (el) { el.remove(); });

    // Quarto dodaje "Appendix A — " prefiks dodacima; na hub stranicama smeta.
    var strip = function (s) {
      return s.replace(/^Appendix\s+\S*\s*[—–-]\s*/i, "").replace(/^\s*[—–-]\s+/, "").trim();
    };
    var titleEl = document.querySelector("#title-block-header h1.title, h1.title");
    if (titleEl) titleEl.textContent = strip(titleEl.textContent);
    document.title = strip(document.title);

  // -------------------------------------------------------------------
  // 7. Upravljačke ploče interaktivnih grafova
  //    Observable rendira kontrole asinkrono, pa MutationObserver hvata
  //    njihovo pojavljivanje. Ploča se sklapa u <details>, klizači dobiju
  //    ispunu trake (--fill) i gumb za povratak na početne vrijednosti.
  // -------------------------------------------------------------------
  function setupOjsPanels() {
    function paintFill(r) {
      var min = parseFloat(r.min), max = parseFloat(r.max);
      if (!isFinite(min)) min = 0;
      if (!isFinite(max)) max = 100;
      var pct = max > min ? ((r.value - min) / (max - min)) * 100 : 0;
      r.style.setProperty("--fill", pct.toFixed(2) + "%");
    }

    function enhanceRange(r) {
      if (r.dataset.ojsEnhanced) return;
      r.dataset.ojsEnhanced = "1";
      r.dataset.ojsInitial = r.value;
      paintFill(r);
      r.addEventListener("input", function () {
        paintFill(r);
        var num = r.parentElement && r.parentElement.querySelector('input[type="number"]');
        if (num) {
          num.classList.remove("ojs-pulse");
          void num.offsetWidth;
          num.classList.add("ojs-pulse");
        }
      });
    }

    function panelMeta(panel) {
      var host = panel.closest && panel.closest("[data-ojs-label]");
      var widget = panel.closest && panel.closest(".widget-frame[data-naslov]");
      var widgetTitle = widget && widget.getAttribute("data-naslov");
      return {
        label: host && host.getAttribute("data-ojs-label") ||
          (widgetTitle ? "Postavke: " + widgetTitle : "Parametri simulacije"),
        hint: host && host.getAttribute("data-ojs-hint") ||
          "otvori za promjenu vrijednosti"
      };
    }

    function collapsePanel(panel) {
      if (panel.dataset.ojsCollapsed) return;
      var parent = panel.parentElement;
      if (!parent) return;
      panel.dataset.ojsCollapsed = "1";
      var meta = panelMeta(panel);

      var details = document.createElement("details");
      details.className = "ojs-collapsible";
      var summary = document.createElement("summary");
      summary.className = "ojs-collapsible-summary";
      summary.innerHTML =
        '<span class="ojs-collapsible-icon" aria-hidden="true"></span>' +
        '<span class="ojs-collapsible-label"></span>' +
        '<span class="ojs-collapsible-hint"></span>';
      summary.querySelector(".ojs-collapsible-label").textContent = meta.label;
      summary.querySelector(".ojs-collapsible-hint").textContent = meta.hint;

      parent.insertBefore(details, panel);
      details.appendChild(summary);
      details.appendChild(panel);
    }

    function enhancePanel(panel) {
      if (panel.dataset.ojsPanel) return;
      panel.dataset.ojsPanel = "1";
      panel.querySelectorAll("input, select, textarea").forEach(function (el) {
        if (el.dataset.ojsInitial === undefined) el.dataset.ojsInitial = el.value;
        if (el.type === "checkbox" || el.type === "radio") {
          el.dataset.ojsInitialChecked = el.checked ? "1" : "0";
        }
      });
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ojs-reset";
      btn.textContent = "↺ početne vrijednosti";
      btn.title = "Vrati početne vrijednosti";
      btn.addEventListener("click", function () {
        panel.querySelectorAll('input[type="range"]').forEach(function (r) {
          if (r.dataset.ojsInitial === undefined) return;
          r.value = r.dataset.ojsInitial;
          r.dispatchEvent(new Event("input", { bubbles: true }));
        });
        panel.querySelectorAll(
          'input:not([type="range"]), select, textarea'
        ).forEach(function (el) {
          if (el.dataset.ojsInitial === undefined) return;
          if (el.type === "checkbox" || el.type === "radio") {
            el.checked = el.dataset.ojsInitialChecked === "1";
          } else {
            el.value = el.dataset.ojsInitial;
          }
          el.dispatchEvent(new Event("input", { bubbles: true }));
          el.dispatchEvent(new Event("change", { bubbles: true }));
        });
      });
      panel.appendChild(btn);
      collapsePanel(panel);
    }

    var scanQueued = false;
    function scan() {
      scanQueued = false;
      document.querySelectorAll('form[class^="oi-"] input[type="range"]').forEach(enhanceRange);
      document.querySelectorAll('form[class^="oi-"]').forEach(function (f) {
        if (f.classList.contains("quarto-ojs-table-fixup")) return;
        var p = f.parentElement;
        if (p && p.tagName === "DIV") enhancePanel(p);
      });
      document.querySelectorAll(".widget-frame .widget-foot").forEach(function (foot) {
        if (!foot.hasAttribute("role")) foot.setAttribute("role", "status");
        if (!foot.hasAttribute("aria-live")) foot.setAttribute("aria-live", "polite");
      });
    }
    function queueScan() {
      if (scanQueued) return;
      scanQueued = true;
      window.requestAnimationFrame(scan);
    }

    scan();
    new MutationObserver(queueScan).observe(document.body, { childList: true, subtree: true });
  }

  // -------------------------------------------------------------------
  // 8. Sklopivi prozni blokovi — „Što isprobati" uz interaktivni graf
  // -------------------------------------------------------------------
  function wrapCollapsible(node, label, hint) {
    if (node.dataset.ojsCollapsibleWrapped) return null;
    var parent = node.parentElement;
    if (!parent) return null;
    node.dataset.ojsCollapsibleWrapped = "1";

    var details = document.createElement("details");
    details.className = "ojs-collapsible ojs-collapsible-prose";
    var summary = document.createElement("summary");
    summary.className = "ojs-collapsible-summary";
    summary.innerHTML =
      '<span class="ojs-collapsible-icon" aria-hidden="true"></span>' +
      '<span class="ojs-collapsible-label"></span>' +
      '<span class="ojs-collapsible-hint"></span>';
    summary.querySelector(".ojs-collapsible-label").textContent = label;
    summary.querySelector(".ojs-collapsible-hint").textContent = hint || "otvori za prikaz";

    var body = document.createElement("div");
    body.className = "ojs-collapsible-body";

    parent.insertBefore(details, node);
    details.appendChild(summary);
    details.appendChild(body);
    body.appendChild(node);
    return body;
  }

  function setupProseCollapsibles() {
    var main = document.querySelector("main.content") || document.querySelector("main");
    if (!main) return;

    main.querySelectorAll("p").forEach(function (p) {
      if (p.dataset.ojsCollapsibleWrapped) return;
      var strong = p.querySelector(":scope > strong:first-child");
      if (!strong) return;
      if (strong.textContent.trim().replace(/[.:]\s*$/, "") !== "Što isprobati") return;
      var next = p.nextElementSibling;
      strong.remove();
      if (p.firstChild && p.firstChild.nodeType === 3) {
        p.firstChild.nodeValue = p.firstChild.nodeValue.replace(/^[\s.:]+/, "");
      }
      var body = wrapCollapsible(p, "Što isprobati", "otvori za upute uz graf");
      if (body && next && (next.matches("ol") || next.matches("ul"))) {
        body.appendChild(next);
      }
    });
  }

  // -------------------------------------------------------------------
  // 9. AI izbornik u podnožju poglavlja
  //    Radi samo na kanonskim putovima poglavlja i koristi tekstove koje
  //    generira R/build-ai-exports.R.
  // -------------------------------------------------------------------
  function setupChapterAI() {
    var zapis = AI_PUTOVI_POGLAVLJA.find(function (kandidat) {
      return location.pathname.endsWith(kandidat.route);
    });
    if (!zapis) return;
    if (document.querySelector(".ai-cta")) return;
    var slug = zapis.ai.replace(/^.*\//, "").replace(/\.md$/, "");

    var mdHref  = zapis.ai;
    var uciHref = PUTOVI_STRANICA.ai;
    var pmHref  = PUTOVI_STRANICA.glossary + "?poglavlje=" + encodeURIComponent(slug);
    var absMd   = location.origin + mdHref;
    var q = encodeURIComponent(
      UPUTA +
      "\n\nTekst poglavlja nalazi se na ovoj poveznici, pročitaj ga i odgovaraj na temelju njega: " +
      absMd);

    var box = document.createElement("div");
    box.className = "ai-cta-foot";

    var det = document.createElement("details");
    det.className = "ai-cta";
    det.innerHTML =
      "<summary>🤖 Pitaj AI o ovom poglavlju</summary>" +
      '<div class="ai-cta-menu">' +
        '<a href="' + mdHref + '" download>⬇ Preuzmi tekst (.md)</a>' +
        '<a href="https://claude.ai/new?q=' + q + '" target="_blank" rel="noopener">Otvori u Claudeu</a>' +
        '<a href="https://chatgpt.com/?q=' + q + '" target="_blank" rel="noopener">Otvori u ChatGPT-u</a>' +
        '<a href="' + uciHref + '">Sve opcije i cijela knjiga →</a>' +
      "</div>";

    var pm = document.createElement("a");
    pm.className = "ai-cta-pm";
    pm.href = pmHref;
    pm.innerHTML = "🕸 Pojmovi ovog poglavlja u mreži";

    box.appendChild(det);
    box.appendChild(pm);

    var article = document.querySelector("main.content") || document.querySelector("main");
    if (!article) return;
    var fn = article.querySelector("section.footnotes, #refs, section#footnotes");
    if (fn) fn.parentNode.insertBefore(box, fn);
    else article.appendChild(box);
  }

  // -------------------------------------------------------------------
  // 10. Pojmovi na dodir
  //     [statističko zaključivanje]{.pojam def="…" en="…" ch="8"}
  //     Pandoc atribute prenosi doslovno na <span>, pa oblačić gradimo
  //     odavde. Izgled je u styles/_base.scss (.pojam__oblacic).
  // -------------------------------------------------------------------
  function setupPojmovi() {
    var pojmovi = document.querySelectorAll("span.pojam");
    if (!pojmovi.length) return;

    pojmovi.forEach(function (el) {
      if (el.dataset.pojamSpreman) return;
      el.dataset.pojamSpreman = "1";

      var def = el.getAttribute("def") || "";
      var en  = el.getAttribute("en")  || "";
      var ch  = el.getAttribute("ch")  || "";
      if (!def && !en && !ch) return;

      el.setAttribute("tabindex", "0");

      var tip = document.createElement("span");
      tip.className = "pojam__oblacic";
      tip.setAttribute("role", "tooltip");

      var glava = document.createElement("span");
      glava.className = "pojam__glava";
      glava.textContent = el.textContent.trim();
      tip.appendChild(glava);

      if (def) tip.appendChild(document.createTextNode(def));
      if (en) {
        var e = document.createElement("em");
        e.className = "pojam__en";
        e.textContent = " " + en;
        tip.appendChild(e);
      }
      if (ch) {
        var c = document.createElement("span");
        c.className = "pojam__pogl";
        c.textContent = "→ pogl. " + ch;
        tip.appendChild(c);
      }
      el.appendChild(tip);
    });

    // Dodir i tipkovnica: klik otvara, klik izvan zatvara (CSS pokriva miš).
    document.addEventListener("click", function (e) {
      var t = e.target.closest && e.target.closest("span.pojam");
      document.querySelectorAll("span.pojam.je-otvoren").forEach(function (o) {
        if (o !== t) o.classList.remove("je-otvoren");
      });
      if (t) { t.classList.toggle("je-otvoren"); e.stopPropagation(); }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      document.querySelectorAll("span.pojam.je-otvoren")
        .forEach(function (o) { o.classList.remove("je-otvoren"); });
    });
  }

  // -------------------------------------------------------------------
  // 11. Traka metapodataka na otvaranju poglavlja
  //     U .qmd-u se piše kao obična tablica unutar ::: {.chapter-meta};
  //     ovdje postaje jedan redak parova natpis / vrijednost.
  // -------------------------------------------------------------------
  function setupChapterMeta() {
    document.querySelectorAll(".chapter-meta").forEach(function (box) {
      var table = box.querySelector("table");
      if (!table || box.dataset.metaSpremna) return;
      box.dataset.metaSpremna = "1";

      var glave = [].map.call(table.querySelectorAll("thead th"),
        function (th) { return th.textContent.trim(); });
      var polja = [].map.call(table.querySelectorAll("tbody tr:first-child td"),
        function (td) { return td.textContent.trim(); });
      if (!glave.length) return;

      var red = document.createElement("div");
      red.className = "chapter-meta__row";
      glave.forEach(function (g, i) {
        var cell = document.createElement("div");
        var k = document.createElement("span");
        k.className = "chapter-meta__key";
        k.textContent = g;
        cell.appendChild(k);
        cell.appendChild(document.createTextNode(polja[i] || "—"));
        red.appendChild(cell);
      });

      var wrap = table.closest(".table, figure") || table;
      wrap.parentNode.replaceChild(red, wrap);
    });
  }

  // -------------------------------------------------------------------
  // 12. Pamćenje stanja widgeta
  //     Čitatelj koji odscrola i vrati se ne gubi svoje istraživanje.
  //     Ključ je po stranici; vrijednosti su samo brojevi i nizovi iz
  //     kontrola, pa localStorage ne nosi ništa osobno.
  // -------------------------------------------------------------------
  function setupWidgetMemory() {
    var kljuc = "statistika:widget:" + location.pathname;
    var IZBOR = ".widget-frame input, .widget-frame select, " +
                'form[class^="oi-"] input, form[class^="oi-"] select';

    function spremi() {
      var s = {};
      document.querySelectorAll(IZBOR).forEach(function (el, i) {
        if (el.type === "checkbox" || el.type === "radio") s[i] = el.checked;
        else s[i] = el.value;
      });
      try { localStorage.setItem(kljuc, JSON.stringify(s)); } catch (e) {}
    }

    function vrati() {
      var s;
      try { s = JSON.parse(localStorage.getItem(kljuc) || "null"); } catch (e) { return; }
      if (!s) return;
      var polja = document.querySelectorAll(IZBOR);
      if (!polja.length) return;
      polja.forEach(function (el, i) {
        if (!(i in s)) return;
        if (el.type === "checkbox" || el.type === "radio") el.checked = !!s[i];
        else el.value = s[i];
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
    }

    // Observable rendira kontrole asinkrono; jedan pokušaj nakon učitavanja
    // je dovoljan jer se stanje pamti na svaku promjenu.
    window.setTimeout(vrati, 600);
    document.addEventListener("input", function (e) {
      if (e.target.closest && e.target.closest('.widget-frame, form[class^="oi-"]')) spremi();
    });
  }

  // -------------------------------------------------------------------
  // 13. Mobilna navigacija
  //     Zatvoreno zaglavlje ostaje jedan redak. Pretraga, bočni izbornik
  //     i hamburger čine jednu skupinu, a sekundarni alati sele u otvoreni
  //     glavni izbornik. Na širokom zaslonu sve se vraća na Quartova mjesta.
  // -------------------------------------------------------------------
  function setupMobileNavbar() {
    var navbar = document.querySelector("#quarto-header .navbar");
    if (!navbar) return;
    var container = navbar.querySelector(".navbar-container");
    var collapse = navbar.querySelector(".navbar-collapse");
    var toggler = navbar.querySelector(".navbar-toggler");
    if (!container || !collapse || !toggler) return;

    var tools = navbar.querySelector(".quarto-navbar-tools");
    var secondary = document.querySelector("#quarto-header .quarto-secondary-nav");
    var sidebarButton = secondary && secondary.querySelector(".quarto-btn-toggle");
    var searchButton = secondary && secondary.querySelector(".quarto-search-button");
    if (!searchButton && document.body.classList.contains("pojmovnik-page")) {
      var searchHost = navbar.querySelector("#quarto-search");
      if (searchHost) searchHost.hidden = true;
      searchButton = document.createElement("button");
      searchButton.type = "button";
      searchButton.className = "btn quarto-search-button";
      searchButton.setAttribute("aria-label", "Pretraži knjigu");
      searchButton.setAttribute("title", "Pretraži knjigu");
      searchButton.innerHTML = '<i class="bi bi-search" aria-hidden="true"></i>';
      searchButton.addEventListener("click", function () {
        if (window.quartoOpenSearch) window.quartoOpenSearch();
      });
      if (tools) tools.appendChild(searchButton);
      else container.insertBefore(searchButton, toggler);
    }
    var brandTitle = navbar.querySelector(".navbar-title");
    var fullBrand = brandTitle ? brandTitle.textContent.trim() : "";
    var actions = null;

    function markerFor(el, name) {
      if (!el) return null;
      var marker = document.createComment("navbar-" + name);
      el.parentNode.insertBefore(marker, el);
      return marker;
    }

    var positions = [
      { node: toggler, marker: markerFor(toggler, "toggler") },
      { node: tools, marker: markerFor(tools, "tools") },
      { node: sidebarButton, marker: markerFor(sidebarButton, "sidebar") },
      { node: searchButton, marker: markerFor(searchButton, "search") }
    ];

    function restore(item) {
      if (item.node && item.marker && item.marker.parentNode) {
        item.marker.parentNode.insertBefore(item.node, item.marker);
      }
    }

    function localize() {
      toggler.setAttribute("aria-label", "Otvori navigaciju");
      if (sidebarButton) {
        sidebarButton.setAttribute("aria-label", "Otvori sadržaj knjige");
      }
      if (searchButton) {
        var searchControl = searchButton.matches("button")
          ? searchButton
          : searchButton.querySelector("button");
        if (searchControl) {
          searchControl.setAttribute("aria-label", "Pretraži knjigu");
          searchControl.setAttribute("title", "Pretraži knjigu");
        }
      }

      var labels = {
        "Source Code": "Izvorni kod",
        "Share": "Podijeli",
        "Toggle dark mode": "Promijeni temu",
        "Toggle light mode": "Promijeni temu",
        "Toggle reader mode": "Način čitanja"
      };
      navbar.querySelectorAll(".quarto-navigation-tool").forEach(function (a) {
        var source = a.getAttribute("title") || a.getAttribute("aria-label") || "";
        if (!labels[source]) return;
        a.setAttribute("title", labels[source]);
        a.setAttribute("aria-label", labels[source]);
      });
    }

    function organize(mobile) {
      document.body.classList.toggle("navbar-mobile-organized", mobile);
      if (secondary) secondary.classList.toggle("mobile-nav-relocated", mobile);
      if (brandTitle) brandTitle.textContent = mobile ? "Osnove statistike" : fullBrand;

      if (mobile) {
        if (!actions) {
          actions = document.createElement("div");
          actions.className = "mobile-navbar-actions";
          container.insertBefore(actions, collapse);
        }
        if (sidebarButton) actions.appendChild(sidebarButton);
        if (searchButton) actions.appendChild(searchButton);
        actions.appendChild(toggler);
        if (tools) collapse.appendChild(tools);
      } else {
        positions.forEach(restore);
        if (actions) {
          actions.remove();
          actions = null;
        }
      }
    }

    localize();
    var mq = window.matchMedia("(max-width: 991.98px)");
    organize(mq.matches);
    var onChange = function (e) { organize(e.matches); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else mq.addListener(onChange);
  }

  // -------------------------------------------------------------------
  // 14. Stranica 404 pri lokalnom posluživanju iz korijena
  //     Lokalni resursi ugrađuju se nakon rendera, ali navigacijske poveznice
  //     i dalje nose produkcijski podput. Izvan tog podputa vraćamo ih na
  //     lokalni korijen; na GitHub Pagesu ostaju netaknute.
  // -------------------------------------------------------------------
  function setupNotFoundFallback() {
    if (!document.body.classList.contains("not-found-page")) return;
    var offset = document.querySelector('meta[name="quarto:offset"]');
    var prefix = offset ? (offset.getAttribute("content") || "") : "";
    prefix = prefix.replace(/\/+$/, "");
    if (!prefix || prefix === "/" ||
        location.pathname === prefix ||
        location.pathname.indexOf(prefix + "/") === 0) return;

    document.querySelectorAll("[href], [src]").forEach(function (el) {
      ["href", "src"].forEach(function (attr) {
        var value = el.getAttribute(attr);
        if (!value || value.indexOf(prefix + "/") !== 0) return;
        el.setAttribute(attr, value.slice(prefix.length));
      });
    });
  }

  // -------------------------------------------------------------------
  // 15. Poveznice s istog izvorišta
  //     Quarto ih u lokalnom pregledu katkad označi kao vanjske prije nego
  //     što razriješi adresu. `no-external` sprečava naknadno ukrašavanje,
  //     a već dodani znak i otvaranje u novoj kartici uklanjaju se.
  // -------------------------------------------------------------------
  function setupSameOriginLinks() {
    var queued = false;

    function clean() {
      queued = false;
      document.querySelectorAll("a[href]").forEach(function (a) {
        var url;
        try { url = new URL(a.getAttribute("href"), location.href); }
        catch (e) { return; }
        if (url.origin !== location.origin) return;

        a.classList.add("no-external");
        a.classList.remove("external", "external-link");
        a.removeAttribute("data-external");
        if (a.getAttribute("target") === "_blank") a.removeAttribute("target");

        var rel = (a.getAttribute("rel") || "").split(/\s+/).filter(Boolean)
          .filter(function (token) {
            return token !== "external" && token !== "noopener" &&
              token !== "noreferrer";
          });
        if (rel.length) a.setAttribute("rel", rel.join(" "));
        else a.removeAttribute("rel");
      });
    }

    function queue() {
      if (queued) return;
      queued = true;
      window.requestAnimationFrame(clean);
    }

    clean();
    window.setTimeout(clean, 250);
    new MutationObserver(queue).observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  // -------------------------------------------------------------------
  // 16. Široke tablice
  //     Vodoravno pomicanje dobiva tipkovni fokus, jasan naziv i vidljivu
  //     uputu samo kada je tablica doista šira od raspoloživog prostora.
  // -------------------------------------------------------------------
  function setupAccessibleTables() {
    var nextId = 0;
    var queued = false;
    var resizeObserver = typeof ResizeObserver === "function"
      ? new ResizeObserver(queueScan)
      : null;

    function tableLabel(table) {
      var caption = table.querySelector("caption");
      var figure = table.closest("figure");
      if (!caption && figure) caption = figure.querySelector("figcaption");
      var text = caption && caption.textContent
        ? caption.textContent.trim().replace(/\s+/g, " ")
        : "";
      return text ? "Tablica: " + text : "Tablica s vodoravnim pomicanjem";
    }

    function wrapperFor(table) {
      var parent = table.parentElement;
      if (parent && (
        parent.classList.contains("table-responsive") ||
        parent.classList.contains("cell-output-display")
      )) {
        return parent;
      }

      var wrapper = document.createElement("div");
      wrapper.className = "table-responsive";
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
      return wrapper;
    }

    function update(table, scroller, hint) {
      if (!table.isConnected || !scroller.isConnected) return;
      var overflows = table.scrollWidth > scroller.clientWidth + 1;
      scroller.classList.toggle("table-scrollable", overflows);
      hint.hidden = !overflows;

      if (overflows) {
        if (!scroller.hasAttribute("tabindex")) {
          scroller.tabIndex = 0;
          scroller.dataset.tableManagedTabindex = "1";
        }
        if (!scroller.hasAttribute("role")) {
          scroller.setAttribute("role", "region");
          scroller.dataset.tableManagedRole = "1";
        }
        if (!scroller.hasAttribute("aria-label")) {
          scroller.setAttribute("aria-label", tableLabel(table));
          scroller.dataset.tableManagedLabel = "1";
        }
        var describedBy = (scroller.getAttribute("aria-describedby") || "")
          .split(/\s+/).filter(Boolean);
        if (describedBy.indexOf(hint.id) === -1) describedBy.push(hint.id);
        scroller.setAttribute("aria-describedby", describedBy.join(" "));
      } else {
        if (scroller.dataset.tableManagedTabindex) {
          scroller.removeAttribute("tabindex");
          delete scroller.dataset.tableManagedTabindex;
        }
        if (scroller.dataset.tableManagedRole) {
          scroller.removeAttribute("role");
          delete scroller.dataset.tableManagedRole;
        }
        if (scroller.dataset.tableManagedLabel) {
          scroller.removeAttribute("aria-label");
          delete scroller.dataset.tableManagedLabel;
        }
        var remaining = (scroller.getAttribute("aria-describedby") || "")
          .split(/\s+/).filter(Boolean)
          .filter(function (id) { return id !== hint.id; });
        if (remaining.length) {
          scroller.setAttribute("aria-describedby", remaining.join(" "));
        } else {
          scroller.removeAttribute("aria-describedby");
        }
      }
    }

    function prepare(table) {
      if (table.dataset.tableScrollerReady || table.closest(".chapter-meta")) {
        return;
      }
      table.dataset.tableScrollerReady = "1";
      var scroller = wrapperFor(table);
      var hint = document.createElement("p");
      hint.className = "table-scroll-hint";
      hint.id = "table-scroll-hint-" + (++nextId);
      hint.textContent = "↔ Pomaknite tablicu za preostale stupce";
      hint.hidden = true;
      scroller.insertAdjacentElement("afterend", hint);

      var refresh = function () {
        window.requestAnimationFrame(function () {
          update(table, scroller, hint);
        });
      };
      refresh();
      table.addEventListener("load", refresh, true);
      if (resizeObserver) resizeObserver.observe(scroller);
    }

    function scan() {
      queued = false;
      document.querySelectorAll("main table, #quarto-content table")
        .forEach(prepare);
    }

    function queueScan() {
      if (queued) return;
      queued = true;
      window.requestAnimationFrame(scan);
    }

    scan();
    window.addEventListener("load", queueScan);
    window.addEventListener("resize", queueScan);
    new MutationObserver(queueScan).observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  // -------------------------------------------------------------------
  // 17. Pretraživanje
  //     Quarto prevodi vidljivi tekst iz `language`, ali Algolijina ovojnica
  //     zadržava nekoliko engleskih pristupačnih naziva. Prevodimo i početne
  //     elemente i kontrole koje se umeću tek kada se pretraživanje otvori.
  // -------------------------------------------------------------------
  function setupSearchLocalization() {
    var translations = {
      "Search": "Pretraži",
      "Clear": "Očisti pretraživanje",
      "Cancel": "Odustani",
      "Submit": "Pretraži",
      "Close": "Zatvori",
      "Reset": "Vrati početno"
    };
    var queued = false;

    function localize() {
      queued = false;
      document.querySelectorAll(
        ".aa-Autocomplete, .aa-DetachedSearchButton, " +
        ".aa-DetachedOverlay [aria-label], " +
        ".aa-DetachedOverlay [title], " +
        ".aa-DetachedOverlay [placeholder]"
      ).forEach(function (element) {
        ["aria-label", "title", "placeholder"].forEach(function (attribute) {
          var value = element.getAttribute(attribute);
          if (value && translations[value]) {
            element.setAttribute(attribute, translations[value]);
          }
        });
      });
    }

    function queue() {
      if (queued) return;
      queued = true;
      window.requestAnimationFrame(localize);
    }

    localize();
    new MutationObserver(queue).observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  // -------------------------------------------------------------------
  function init() {
    try { setupProgressBar(); } catch (e) {}
    try { setupInternalHover(); } catch (e) {}
    try { setupDinkus(); } catch (e) {}
    try { setupAnchorLinks(); } catch (e) {}
    try { setupStandalonePages(); } catch (e) {}
    try { setupNastavaActiveState(); } catch (e) {}
    try { pruneSidebar(); } catch (e) {}
    try { setupOjsPanels(); } catch (e) {}
    try { setupProseCollapsibles(); } catch (e) {}
    try { setupChapterAI(); } catch (e) {}
    try { setupPojmovi(); } catch (e) {}
    try { setupChapterMeta(); } catch (e) {}
    try { setupWidgetMemory(); } catch (e) {}
    try { setupMobileNavbar(); } catch (e) {}
    try { setupNotFoundFallback(); } catch (e) {}
    try { setupSameOriginLinks(); } catch (e) {}
    try { setupAccessibleTables(); } catch (e) {}
    try { setupSearchLocalization(); } catch (e) {}
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
